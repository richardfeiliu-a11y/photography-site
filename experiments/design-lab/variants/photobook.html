<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>Richard — Photobook</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    :root {
      --paper: #f7f7f4;
      --white: #ffffff;
      --ink: #292a27;
      --muted: #686963;
      --rule: #d9dad4;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Lab Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      --viewer-bg: var(--paper);
      --viewer-ink: var(--ink);
    }
    button { background: transparent; border: 0; padding: 0; text-align: left; }
    a { text-underline-offset: 5px; }
    button, a, select { touch-action: manipulation; }
    button:focus-visible, a:focus-visible, select:focus-visible {
      outline: 2px solid var(--ink); outline-offset: 6px;
    }
    .skip { position: fixed; left: 20px; top: -100px; z-index: 20; background: var(--white); padding: 12px; }
    .skip:focus { top: 12px; }
    .masthead {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 24px; padding: 38px 5.5vw 0;
    }
    .signature { font-family: 'Lab Serif', serif; font-size: 23px; min-height: 44px; }
    .navigation { display: flex; flex-wrap: wrap; gap: 12px 30px; }
    .navigation button { min-height: 44px; font-size: 13px; }
    .navigation button[aria-current="page"] { text-decoration: underline; text-underline-offset: 7px; }
    main { min-height: 70vh; }
    main :is(article, section, figure, .opening-image) { min-width: 0; }
    .entry-title, .book-caption button, .place-choice span { overflow-wrap: anywhere; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: 'Lab Serif', serif; font-weight: 400; }
    h1 { font-size: clamp(38px, 4.2vw, 65px); line-height: 1.1; letter-spacing: -.025em; }
    h2 { font-size: clamp(25px, 2.7vw, 39px); line-height: 1.2; }
    .quiet { font-size: 12px; color: var(--muted); }
    .opening {
      display: grid; grid-template-columns: 1fr 2.5fr; gap: 7vw;
      margin: 110px 11vw 0 9vw; align-items: start;
    }
    .opening-text { padding-top: 50px; }
    .opening-text h1 { margin-bottom: 36px; }
    .opening-text .quiet { max-width: 165px; }
    .opening-image { width: 100%; }
    .image-button { display: block; width: 100%; }
    .image-button img { width: 100%; height: auto; object-fit: contain; }
    .opening-image img { max-height: 65vh; object-fit: contain; object-position: right top; }
    .book-caption { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-top: 18px; }
    .book-caption button { min-height: 44px; font-size: 14px; }
    .book-caption span { flex-shrink: 0; font-size: 11px; color: var(--muted); }
    .selection { margin: 140px 8vw 0; }
    .selection-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 70px; }
    .selection-heading h2 { font-size: 20px; }
    .selection-heading button { font-size: 12px; min-height: 44px; text-decoration: underline; text-underline-offset: 5px; }
    .loose-spread { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 3vw; align-items: start; }
    .volume { grid-column: 2 / 7; margin: 0 0 125px; }
    .volume:nth-child(2) { grid-column: 9 / 13; margin-top: 160px; }
    .volume:nth-child(3) { grid-column: 1 / 5; }
    .volume:nth-child(4) { grid-column: 7 / 13; margin-top: 90px; }
    .volume:nth-child(5) { grid-column: 3 / 9; margin-top: 35px; }
    .volume img { max-height: 540px; object-position: left top; }
    .volume .volume-title { font-family: 'Lab Serif', serif; font-size: 21px; }
    .volume .book-caption { align-items: flex-start; }
    .volume .book-caption span { padding-top: 13px; }
    .page-intro { margin: 110px 9vw 75px; display: grid; grid-template-columns: 1fr 1fr; gap: 9vw; align-items: end; }
    .page-intro p { max-width: 290px; font-size: 13px; color: var(--muted); }
    .archive-tools { display: flex; align-items: center; gap: 18px; margin: 0 9vw 50px; }
    .archive-tools label { font-size: 12px; }
    select { color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 0; font: inherit; padding: 10px 30px 10px 12px; min-height: 44px; }
    .bibliography { margin: 0 9vw; }
    .year-section { display: grid; grid-template-columns: 1fr 3fr; gap: 6vw; margin-bottom: 85px; }
    .year-section > h2 { font-size: 22px; padding-top: 20px; }
    .entry { width: 100%; display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; align-items: center; gap: 25px; padding: 24px 0; border-top: 1px solid var(--rule); }
    .entry img { width: 66px; max-height: 85px; object-fit: contain; }
    .entry-title { font-family: 'Lab Serif', serif; font-size: 23px; line-height: 1.25; display: block; }
    .entry-places { font-size: 12px; color: var(--muted); display: block; margin-top: 6px; }
    .entry-details { text-align: right; font-size: 11px; color: var(--muted); }
    .entry-details time { display: block; margin-bottom: 5px; }
    .place-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 10vw; margin: 0 9vw 140px; }
    .place-index { align-self: start; border-top: 1px solid var(--rule); }
    .place-choice { width: 100%; min-height: 55px; display: flex; gap: 20px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); padding: 12px 0; }
    .place-choice span { font-family: 'Lab Serif', serif; font-size: 21px; }
    .place-choice small { color: var(--muted); font-size: 11px; }
    .place-choice[aria-pressed="true"] span { text-decoration: underline; text-underline-offset: 6px; }
    .place-title { font-size: 40px; margin: 0 0 10px; }
    .place-editions { margin-top: 65px; }
    .place-volume { margin: 0 0 85px; }
    .place-volume:nth-child(even) { width: 77%; margin-left: auto; }
    .place-volume img { max-height: 460px; }
    .colophon { display: grid; grid-template-columns: 1fr 1.25fr; gap: 12vw; margin: 130px 12vw 160px 9vw; }
    .colophon .byline { font-family: 'Lab Serif', serif; font-size: clamp(28px, 3vw, 45px); line-height: 1.3; margin-bottom: 75px; }
    .colophon-copy { max-width: 320px; }
    .colophon-copy > p { font-size: 14px; margin-bottom: 35px; }
    .colophon dl { display: grid; grid-template-columns: 1fr auto; gap: 15px 30px; padding-top: 25px; border-top: 1px solid var(--rule); font-size: 13px; margin: 0 0 35px; }
    .colophon dd { margin: 0; }
    .text-link { min-height: 44px; text-decoration: underline; text-underline-offset: 5px; font-size: 13px; }
    .colophon-photo { margin: 0; padding-top: 110px; }
    .colophon-photo img { max-height: 450px; object-fit: contain; width: 100%; }
    .colophon-photo figcaption { margin-top: 15px; font-size: 12px; color: var(--muted); }
    footer { display: flex; gap: 20px; justify-content: space-between; align-items: baseline; margin: 0 5.5vw; padding: 35px 0 45px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
    footer button { font-size: 12px; min-height: 44px; }
    .loading { margin: 120px 9vw; }
    .lab-viewer-bar { border-bottom: 1px solid var(--rule); padding: 20px 5.5vw; }
    .lab-viewer-title { font-family: 'Lab Serif', serif; font-size: 24px; }
    .lab-viewer-count { font-size: 11px; color: var(--muted); }
    .lab-viewer-bar button { border-color: var(--rule); font-size: 12px; min-height: 44px; }
    .lab-viewer-content { padding: 75px 9vw 100px; }
    .collection-preface { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10vw; margin-bottom: 90px; }
    .collection-preface h1 { font-size: 36px; margin-bottom: 24px; overflow-wrap: anywhere; }
    .collection-preface p { font-family: 'Lab Serif', serif; font-size: 22px; line-height: 1.55; max-width: 520px; }
    .collection-preface .quiet { font-family: 'Lab Sans', sans-serif; font-size: 12px; }
    .reading-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
    .reading-controls button { border: 1px solid var(--rule); padding: 11px 18px; font-size: 12px; min-height: 44px; }
    .reading-controls button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }
    .photo-sequence { max-width: 1300px; margin: auto; }
    .lab-viewer .plate { width: 76%; margin: 0 0 125px auto; scroll-margin-top: 130px; }
    .lab-viewer .plate:nth-child(3n + 2) { width: 58%; margin-left: 0; margin-right: auto; }
    .lab-viewer .plate:nth-child(3n) { width: 85%; margin: 0 auto 160px; }
    .lab-viewer .plate img { width: 100%; max-height: 80vh; object-fit: contain; }
    .lab-viewer .plate figcaption { max-width: none; font-size: 11px; color: var(--muted); gap: 25px; margin-top: 16px; }
    .plate figcaption span:last-child { flex-shrink: 0; }
    .photo-sequence.overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 65px 40px; }
    .lab-viewer .overview .plate { width: 100%; margin: 0; }
    .lab-viewer .overview .plate img { max-height: 250px; }
    .collection-end { text-align: center; margin-top: 90px; }
    @media (max-width: 700px) {
      .masthead { padding: 24px 6vw 0; display: block; }
      .signature { font-size: 22px; }
      .navigation { gap: 22px; margin-top: 13px; }
      .opening { margin: 60px 6vw 0; grid-template-columns: 1fr; gap: 45px; }
      .opening-text { padding: 0; }
      .opening-text h1 { margin-bottom: 18px; }
      .opening-text .quiet { max-width: 230px; }
      .opening-image { width: 88%; margin-left: auto; }
      .opening-image img { max-height: none; }
      .book-caption { gap: 12px; }
      .selection { margin: 95px 6vw 0; }
      .selection-heading { margin-bottom: 45px; }
      .loose-spread { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0 14px; }
      .volume, .volume:nth-child(3), .volume:nth-child(5) { grid-column: 1 / 6; margin: 0 0 75px; }
      .volume:nth-child(2), .volume:nth-child(4) { grid-column: 2 / 7; margin: 0 0 75px; }
      .volume .volume-title { font-size: 19px; }
      .volume .book-caption { display: block; }
      .volume .book-caption span { display: block; padding: 0; }
      .page-intro { margin: 70px 6vw 45px; grid-template-columns: 1fr; gap: 24px; }
      .archive-tools { margin: 0 6vw 35px; }
      .bibliography { margin: 0 6vw; }
      .year-section { grid-template-columns: 1fr; gap: 20px; margin-bottom: 55px; }
      .year-section > h2 { padding: 0; }
      .entry { grid-template-columns: 48px minmax(0, 1fr); gap: 8px 18px; padding: 22px 0; }
      .entry img { width: 48px; grid-row: 1 / 3; }
      .entry-title { font-size: 21px; }
      .entry-details { grid-column: 2; text-align: left; display: flex; flex-wrap: wrap; gap: 12px; }
      .entry-details time { margin: 0; }
      .place-layout { grid-template-columns: 1fr; gap: 50px; margin: 0 6vw 90px; }
      .place-index { max-height: 290px; overflow-y: auto; padding: 0 7px; }
      .place-title { font-size: 34px; }
      .place-editions { margin-top: 35px; }
      .place-volume { margin-bottom: 55px; }
      .colophon { margin: 70px 6vw 90px; grid-template-columns: 1fr; gap: 55px; }
      .colophon .byline { margin-bottom: 40px; }
      .colophon-photo { padding: 0; width: 80%; margin-left: auto; }
      footer { flex-wrap: wrap; margin: 0 6vw; gap: 8px 20px; }
      .lab-viewer-bar { padding: 15px 6vw; gap: 15px; }
      .lab-viewer-title { font-size: 20px; overflow-wrap: anywhere; }
      .lab-viewer-bar button { padding: 10px 14px; }
      .lab-viewer-content { padding: 45px 6vw 70px; }
      .collection-preface { grid-template-columns: 1fr; gap: 35px; margin-bottom: 55px; }
      .collection-preface p { font-size: 20px; }
      .lab-viewer .plate, .lab-viewer .plate:nth-child(3n) { width: 100%; margin: 0 0 70px; }
      .lab-viewer .plate:nth-child(3n + 2) { width: 85%; margin-bottom: 70px; }
      .photo-sequence.overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 35px 18px; }
      .lab-viewer .overview .plate { width: 100%; margin: 0; }
      .overview .plate figcaption { display: block; }
      .overview .plate figcaption span { display: block; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to photographs</a>
  <header class="masthead">
    <button class="signature" data-view="home" aria-label="Richard, home">Richard</button>
    <nav class="navigation" aria-label="Main navigation">
      <button data-view="home">Home</button>
      <button data-view="archive">Archive</button>
      <button data-view="places">Places</button>
      <button data-view="about">About</button>
    </nav>
  </header>
  <main id="main" tabindex="-1"><p class="loading" role="status">Opening the photobook…</p></main>
  <footer>
    <span>Photography by Richard</span>
    <span id="footer-count"></span>
    <button data-view="archive">Browse the archive</button>
  </footer>
  <script src="/common.js"></script>
  <script>
    window.DesignLab.ready.then(data => {
      const { escape: esc, image } = window.DesignLab;
      const main = document.querySelector('main');
      const archive = [...data.archive].sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
      const years = [...new Set(archive.map(g => g.date.slice(0, 4)))];
      const places = new Map();
      archive.forEach(g => g.places.forEach(p => {
        if (!places.has(p.id)) places.set(p.id, { ...p, galleries: [] });
        places.get(p.id).galleries.push(g);
      }));
      const placeList = [...places.values()].sort((a, b) => a.title.localeCompare(b.title));
      const count = archive.reduce((sum, g) => sum + g.count, 0);
      const cover = g => g.cover || g.photos[0];
      const placeNames = g => g.places.map(p => p.title).join(', ');
      const photoButton = (g, sizes, eager = false) => `<button class="image-button" data-gallery="${esc(g.id)}" aria-label="Open ${esc(g.title)}">${image(cover(g), sizes, eager)}</button>`;
      const caption = g => `<div class="book-caption">
          <button data-gallery="${esc(g.id)}">${esc(g.title)}</button>
          <span>${esc(g.date.slice(0, 4))} / ${g.count} photographs</span>
          </div>`;
      document.querySelector('#footer-count').textContent = `${archive.length} collections`;

      function home() {
        const featured = data.galleries[0];
        return `<section class="opening">
          <div class="opening-text">
          <h1 tabindex="-1">Photographs</h1>
          <p class="quiet">Selected collections<br>Photography by Richard</p>
          </div>
          <div class="opening-image">${photoButton(featured, '(max-width:700px) 78vw, 54vw', true)}${caption(featured)}</div>
          </section>
          <section class="selection" aria-label="Selected collections">
          <div class="selection-heading">
          <h2>Further pages</h2>
          <button data-view="archive">Complete archive</button>
          </div>
          <div class="loose-spread">${data.galleries.slice(1).map(g => `<article class="volume">${photoButton(g, '(max-width:700px) 75vw, 42vw')}<div class="book-caption">
          <button data-gallery="${esc(g.id)}">
          <span class="volume-title">${esc(g.title)}</span>
          </button>
          <span>${esc(g.date.slice(0, 4))}</span>
          </div>
          <p class="quiet">${esc(placeNames(g))}</p>
          </article>`).join('')}</div>
          </section>`;
      }
      function archiveView(year) {
        const selected = years.includes(year) ? [year] : years;
        return `<section class="page-intro">
          <h1 tabindex="-1">Archive</h1>
          <p>${archive.length} collections, arranged by the date they were photographed. Open a title to read its photographic sequence.</p>
          </section>
          <div class="archive-tools">
          <label for="year">Photographed in</label>
          <select id="year">
          <option value="all">All years</option>${years.map(y => `<option value="${esc(y)}" ${y === year ? 'selected' : ''}>${esc(y)}</option>`).join('')}</select>
          </div>
          <div class="bibliography">${selected.map(y => `<section class="year-section" aria-label="${esc(y)} collections">
          <h2>${esc(y)}</h2>
          <div>${archive.filter(g => g.date.startsWith(y)).map(g => `<button class="entry" data-gallery="${esc(g.id)}">${image(cover(g), '66px')}<span>
          <span class="entry-title">${esc(g.title)}</span>
          <span class="entry-places">${esc(placeNames(g))}</span>
          </span>
          <span class="entry-details">
          <time datetime="${esc(g.date)}">${esc(g.date)}</time>
          <span>${g.count} photographs</span>
          </span>
          </button>`).join('')}</div>
          </section>`).join('')}</div>`;
      }
      function placesView(id) {
        const selected = places.get(id) || placeList[0];
        return `<section class="page-intro">
          <h1 tabindex="-1">Places</h1>
          <p>A directory of the places recorded in these collections. Choose a place to see its photographs.</p>
          </section>
          <div class="place-layout">
          <nav class="place-index" aria-label="Place directory">${placeList.map(p => `<button class="place-choice" data-place="${esc(p.id)}" aria-pressed="${p.id === selected?.id}">
          <span>${esc(p.title)}</span>
          <small>${p.galleries.length} ${p.galleries.length === 1 ? 'collection' : 'collections'}</small>
          </button>`).join('')}</nav>
          <section aria-label="Collections at selected place">${selected ? `<h2 class="place-title">${esc(selected.title)}</h2>
          <p class="quiet">${selected.galleries.length} ${selected.galleries.length === 1 ? 'collection' : 'collections'}</p>
          <div class="place-editions">${selected.galleries.map(g => `<article class="place-volume">${photoButton(g, '(max-width:700px) 88vw, 49vw')}${caption(g)}</article>`).join('')}</div>` : '<p>No places are recorded in the archive.</p>'}</section>
          </div>`;
      }
      function about() {
        const featured = data.galleries[0];
        return `<section class="page-intro">
          <h1 tabindex="-1">About</h1>
          <p>A photographic archive.</p>
          </section>
          <section class="colophon">
          <div class="colophon-copy">
          <p class="byline">Photography<br>by Richard</p>
          <p>This archive brings together photographic collections. Each collection can be read in its original sequence, or explored through the places recorded with it.</p>
          <dl>
          <dt>Published collections</dt>
          <dd>${archive.length}</dd>
          <dt>Photographs in collections</dt>
          <dd>${count}</dd>
          <dt>Recorded places</dt>
          <dd>${places.size}</dd>
          </dl>
          <button class="text-link" data-view="archive">Read the archive</button>
          </div>
          <figure class="colophon-photo">${image(cover(featured), '(max-width:700px) 70vw, 36vw')}<figcaption>${esc(featured.title)}<br>${esc(featured.date)}</figcaption>
          </figure>
          </section>`;
      }
      window.DesignLab.renderGallery = gallery => {
        return `<section class="collection-preface">
          <div><h1>${esc(gallery.title)}</h1>
          <p class="quiet">${esc(placeNames(gallery))}<br>
          <time datetime="${esc(gallery.date)}">${esc(gallery.date)}</time>
          </p>
          <div class="reading-controls" aria-label="Photograph layout">
          <button data-layout="sequence" aria-pressed="true">Sequence</button>
          <button data-layout="overview" aria-pressed="false">Overview</button>
          </div>
          </div>
          <p>${esc(gallery.description)}</p>
          </section>
          <div class="lab-viewer-sequence photo-sequence">${gallery.photos.map((p, i) => `<figure class="plate" data-photo-id="${esc(p.id)}">${image(p, '(max-width:700px) 88vw, 72vw', i === 0)}<figcaption>
          <span>${esc(p.caption)}</span>
          <span>${i + 1} / ${gallery.photos.length}</span>
          </figcaption>
          </figure>`).join('')}</div>
          <div class="collection-end">
          <button class="text-link" data-sequence-top>Return to the beginning</button>
          </div>`;
      };
      function route(focus = false) {
        const [requested, query = ''] = location.hash.slice(1).split('?');
        const view = ['home', 'archive', 'places', 'about'].includes(requested) ? requested : 'home';
        const params = new URLSearchParams(query);
        main.innerHTML = view === 'archive' ? archiveView(params.get('year')) : view === 'places' ? placesView(params.get('place')) : view === 'about' ? about() : home();
        document.querySelectorAll('.navigation [data-view]').forEach(button => {
          if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        document.title = `Richard — ${view === 'home' ? 'Photobook' : view[0].toUpperCase() + view.slice(1)}`;
        if (focus) {
          window.scrollTo({ top: 0, behavior: 'instant' });
          main.querySelector('h1').focus({ preventScroll: true });
        }
      }
      document.addEventListener('click', event => {
        const viewButton = event.target.closest('[data-view]');
        if (viewButton) {
          const next = `#${viewButton.dataset.view}`;
          if (location.hash === next) route(true);
          else location.hash = next;
        }
        const placeButton = event.target.closest('[data-place]');
        if (placeButton) location.hash = `#places?place=${encodeURIComponent(placeButton.dataset.place)}`;
        const modeButton = event.target.closest('[data-layout]');
        if (modeButton) {
          const content = modeButton.closest('.lab-viewer-content');
          content.querySelector('.photo-sequence').classList.toggle('overview', modeButton.dataset.layout === 'overview');
          content.querySelectorAll('[data-layout]').forEach(button => button.setAttribute('aria-pressed', String(button === modeButton)));
        }
        if (event.target.closest('[data-sequence-top]')) {
          document.querySelector('.lab-viewer').scrollTo({ top: 0, behavior: 'instant' });
          document.querySelector('[data-layout="sequence"]').focus({ preventScroll: true });
        }
      });
      main.addEventListener('change', event => {
        if (event.target.id === 'year') location.hash = `#archive?year=${encodeURIComponent(event.target.value)}`;
      });
      window.addEventListener('hashchange', () => route(true));
      route();
    }).catch(() => {
      document.querySelector('main').innerHTML = '<p class="loading" role="alert">The photographic archive could not be loaded. Reload this page to try again.</p>';
    });
  </script>
</body>
</html>
