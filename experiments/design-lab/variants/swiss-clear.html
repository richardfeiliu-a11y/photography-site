<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <script>
    // 在绘制页面前读取偏好，避免深色模式先闪白。
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    let themePreference = localStorage.getItem('photography-swiss-theme');
    document.documentElement.dataset.theme = themePreference === 'dark' || themePreference === 'light'
      ? themePreference : themeMedia.matches ? 'dark' : 'light';
  </script>
  <title>Richard — Photography / Swiss</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    :root { color-scheme: light; --bg: #fff; --ink: #000; --accent: #222; --line: #d6d6d6; --quiet: #666; --selected-ink: #fff; --glass-bg: #fff; --glass-border: rgba(20,30,45,.18); --glass-fill: rgba(255,255,255,.40); --glass-edge: rgba(255,255,255,.88); --glass-title: rgba(255,255,255,.78); --glass-button: rgba(255,255,255,.84); --glass-count: #454545; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #111; --ink: #eee; --accent: #eee; --line: #444; --quiet: #aaa; --selected-ink: #111; --glass-bg: #161616; --glass-border: rgba(255,255,255,.22); --glass-fill: rgba(18,18,18,.40); --glass-edge: rgba(255,255,255,.32); --glass-title: rgba(18,18,18,.88); --glass-button: rgba(18,18,18,.90); --glass-count: #ccc; }
    body { background: var(--bg); color: var(--ink); font-family: 'Lab Sans', sans-serif; --viewer-bg: var(--bg); --viewer-ink: var(--ink); }
    button { border: 0; background: transparent; padding: 0; text-align: left; }
    button, a { touch-action: manipulation; }
    button:hover, a:hover { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent) !important; outline-offset: 4px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    h1, h2, h3, p, figure { margin: 0; }
    h1, h2, h3 { font-weight: 400; }
    .shell { width: calc(100% - 80px); max-width: 1760px; margin: auto; }
    .skip { position: fixed; top: -80px; left: 20px; z-index: 10; padding: 12px; background: var(--bg); }
    .skip:focus { top: 12px; }
    .masthead { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 26px 0 24px; border-bottom: 2px solid var(--ink); }
    .identity { font-size: 23px; line-height: 1.05; letter-spacing: -.03em; width: fit-content; }
    .identity span { display: block; color: var(--quiet); }
    .nav { display: flex; align-items: center; justify-content: flex-end; gap: 30px; }
    .nav button { min-height: 44px; font-size: 17px; border-bottom: 3px solid transparent; }
    .nav button[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
    main { min-height: 65vh; }
    .view { padding: 40px 0 100px; }
    .section-line { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 15px 0; border-top: 2px solid var(--ink); font-size: 17px; }
    .section-line span:last-child { text-align: right; }
    .hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; padding-top: 12px; }
    .hero-title { grid-column: 1 / 7; font-size: clamp(85px, 13.5vw, 220px); line-height: .78; letter-spacing: -.065em; padding: 16px 0 42px; align-self: start; }
    .hero-image { grid-column: 7 / 13; padding-top: 44px; min-width: 0; }
    .hero-image > button { display: block; width: 100%; }
    .hero-image img { width: 100%; height: auto; }
    .hero-image figcaption { display: grid; grid-template-columns: 1fr auto; gap: 15px; border-top: 1px solid var(--ink); margin-top: 15px; padding-top: 12px; }
    .hero-image figcaption button { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
    .hero-note { grid-column: 1 / 6; font-size: 23px; line-height: 1.25; max-width: 390px; margin-top: -26px; }
    .hero-meta { grid-column: 7 / 13; display: flex; justify-content: space-between; gap: 20px; color: var(--quiet); font-size: 15px; }
    .selected { margin-top: 90px; }
    .selected-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 32px; }
    .selected-heading h2 { font-size: 48px; letter-spacing: -.04em; }
    .text-link { color: var(--accent); text-decoration: underline; text-underline-offset: 5px; min-height: 44px; }
    .selected-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 50px 24px; }
    .collection { display: block; width: 100%; min-width: 0; align-self: start; }
    .collection:hover .collection-title { text-decoration: underline; text-underline-offset: 5px; }
    .collection .picture { display: block; }
    .collection img { width: 100%; height: auto; }
    .collection-title { display: block; border-top: 1px solid var(--ink); margin-top: 14px; padding-top: 10px; font-size: 25px; line-height: 1.2; text-wrap: balance; }
    .collection-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--quiet); font-size: 15px; padding-top: 8px; font-variant-numeric: tabular-nums; }
    .page-head { display: grid; grid-template-columns: 2fr 1fr; align-items: end; gap: 24px; padding-bottom: 52px; }
    .page-head h1 { font-size: clamp(72px, 10vw, 160px); line-height: .95; letter-spacing: -.06em; overflow-wrap: anywhere; }
    .page-head p { font-size: 20px; line-height: 1.35; max-width: 330px; }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-top: 2px solid var(--ink); padding: 18px 0 28px; }
    .filter-row > span { margin-right: 15px; }
    .filter { padding: 8px 14px; border: 1px solid var(--line); min-height: 44px; }
    .filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--selected-ink); }
    .result-count { color: var(--quiet); margin-left: auto; }
    .archive-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .archive-table col:nth-child(1) { width: 12%; }
    .archive-table col:nth-child(2) { width: 37%; }
    .archive-table col:nth-child(3) { width: 16%; }
    .archive-table col:nth-child(4) { width: 25%; }
    .archive-table col:nth-child(5) { width: 10%; }
    .archive-table th { text-align: left; font-weight: 400; color: var(--quiet); padding: 12px 12px 12px 0; border-bottom: 1px solid var(--ink); }
    .archive-table td { border-bottom: 1px solid var(--line); padding: 22px 16px 22px 0; vertical-align: middle; overflow-wrap: anywhere; }
    .archive-table th:last-child, .archive-table td:last-child { text-align: right; padding-right: 0; }
    .archive-thumb { display: block; width: 92px; max-width: 100%; }
    .archive-thumb img { width: 100%; height: auto; }
    .archive-name { font-size: 28px; line-height: 1.1; min-height: 44px; }
    .archive-mobile-place { display: none; }
    .archive-date { font-variant-numeric: tabular-nums; }
    .archive-places { color: var(--quiet); }
    .place-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 60px; border-top: 2px solid var(--ink); }
    .place-directory { padding-top: 12px; }
    .place-button { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 15px; padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 25px; }
    .place-button span { overflow-wrap: anywhere; }
    .place-button small { font-size: 15px; }
    .place-button[aria-pressed="true"] { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .place-results { padding-top: 28px; min-width: 0; }
    .place-results h2 { font-size: 55px; line-height: 1; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .place-results > p { color: var(--quiet); padding: 12px 0 36px; }
    .place-results .selected-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .about-name { font-size: clamp(80px, 15vw, 240px); letter-spacing: -.065em; line-height: .88; padding: 10px 0 70px; }
    .about-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; border-top: 2px solid var(--ink); padding-top: 28px; }
    .about-copy { font-size: 29px; line-height: 1.2; max-width: 530px; }
    .about-copy p + p { font-size: 19px; line-height: 1.5; margin-top: 30px; max-width: 440px; }
    .facts { margin: 0; }
    .facts div { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 0 0 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .facts dt { font-size: 20px; }
    .facts dd { margin: 0; font-size: 60px; line-height: 1; letter-spacing: -.04em; }
    .about-actions { display: flex; flex-wrap: wrap; gap: 30px; padding-top: 30px; }
    .footer { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 0 36px; border-top: 2px solid var(--ink); font-size: 16px; }
    .footer > div:last-child { display: flex; flex-wrap: wrap; gap: 20px; justify-content: flex-end; }
    .footer p + p { margin-top: 5px; color: var(--quiet); }
    .load-state { padding: 80px 0; font-size: 24px; }
    .lab-viewer-bar { padding: 18px 40px; border-bottom: 2px solid var(--ink); }
    .lab-viewer-title { font-size: 26px; line-height: 1.1; overflow-wrap: anywhere; }
    .lab-viewer-count { color: var(--quiet); }
    .lab-viewer-bar button { color: var(--accent); border-color: var(--accent); flex-shrink: 0; }
    .lab-viewer-content { padding: 36px 40px 80px; }
    .gallery-title { font-size: clamp(42px, 7vw, 100px); line-height: .98; letter-spacing: -.05em; margin-bottom: 36px; overflow-wrap: anywhere; }
    .gallery-intro { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; margin-bottom: 42px; }
    .gallery-intro p { font-size: 23px; line-height: 1.35; max-width: 650px; }
    .gallery-intro aside { color: var(--quiet); font-size: 16px; line-height: 1.5; }
    .gallery-tools { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; padding: 15px 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); margin-bottom: 35px; }
    .gallery-modes { display: flex; gap: 10px; }
    .gallery-modes button { padding: 10px 18px; border: 1px solid var(--line); min-height: 44px; }
    .gallery-modes button[aria-pressed="true"] { background: var(--accent); color: var(--selected-ink); border-color: var(--accent); }
    .swiss-sequence { max-width: 1600px; margin: auto; }
    .lab-viewer .swiss-frame { display: grid; grid-template-columns: 1fr 5fr; gap: 32px; margin: 0 0 80px; padding-top: 22px; border-top: 1px solid var(--line); scroll-margin-top: 130px; }
    .swiss-frame .photo-number { font-size: 45px; line-height: 1; letter-spacing: -.05em; }
    .lab-viewer .swiss-frame img { width: 100%; height: auto; max-height: none; }
    .lab-viewer .swiss-frame figcaption { display: block; font-size: 16px; line-height: 1.35; margin: 15px 0 0; max-width: 700px; }
    .swiss-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 35px 24px; }
    .overview-photo { min-width: 0; width: 100%; align-self: start; }
    .overview-photo img { width: 100%; height: auto; }
    .overview-photo span { display: block; padding-top: 10px; font-size: 17px; }
    .gallery-end { border-top: 2px solid var(--ink); padding-top: 20px; display: flex; justify-content: space-between; gap: 20px; }
    @media (max-width: 900px) {
      .shell { width: calc(100% - 40px); }
      .nav { gap: 18px; }
      .hero { gap: 20px; }
      .hero-title { font-size: 13.5vw; }
      .hero-note { font-size: 20px; margin-top: 0; }
      .selected-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .place-layout { gap: 30px; }
      .archive-name { font-size: 23px; }
      .swiss-overview { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .masthead { grid-template-columns: 1fr; gap: 24px; padding-top: 20px; }
      .identity { font-size: 22px; }
      .nav { justify-content: space-between; gap: 12px; }
      .nav button { font-size: 16px; }
      .view { padding: 28px 0 65px; }
      .section-line { font-size: 14px; }
      .hero { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; }
      .hero-title { grid-column: 1 / 7; font-size: 27vw; padding: 16px 0 8px; }
      .hero-image { grid-column: 2 / 7; padding-top: 0; }
      .hero-image figcaption { grid-template-columns: 1fr; gap: 6px; font-size: 16px; }
      .hero-image figcaption button { min-height: 44px; }
      .hero-note { grid-column: 1 / 7; max-width: 300px; }
      .hero-meta { grid-column: 1 / 7; font-size: 14px; }
      .selected { margin-top: 55px; }
      .selected-heading { align-items: flex-start; }
      .selected-heading h2 { font-size: 37px; line-height: 1; }
      .selected-heading .text-link { font-size: 15px; }
      .selected-grid, .place-results .selected-grid { grid-template-columns: 1fr; gap: 32px; }
      .page-head { grid-template-columns: 1fr; gap: 25px; padding-bottom: 35px; }
      .page-head h1 { font-size: 23vw; }
      .page-head p { font-size: 18px; }
      .filter-row { gap: 8px; }
      .filter-row > span { width: 100%; }
      .filter { padding: 8px 12px; }
      .result-count { width: 100%; margin: 8px 0 0; }
      .archive-table col:nth-child(1) { width: 19%; }
      .archive-table col:nth-child(2) { width: 50%; }
      .archive-table col:nth-child(3) { width: 31%; }
      .archive-table col:nth-child(4), .archive-table col:nth-child(5) { width: 0; }
      .archive-table th:nth-child(n+4), .archive-table td:nth-child(n+4) { display: none; }
      .archive-table td { padding: 18px 10px 18px 0; }
      .archive-table td:nth-child(3), .archive-table th:nth-child(3) { padding-right: 0; text-align: right; }
      .archive-name { font-size: 21px; }
      .archive-date { font-size: 13px; }
      .archive-mobile-place { display: block; font-size: 13px; color: var(--quiet); margin-top: 8px; }
      .place-layout { grid-template-columns: 1fr; gap: 20px; }
      .place-directory { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 20px; }
      .place-button { width: auto; max-width: 100%; padding: 10px 13px; border: 1px solid var(--line); font-size: 18px; }
      .place-button[aria-pressed="true"] { border: 1px solid var(--accent); }
      .place-results h2 { font-size: 44px; }
      .about-name { font-size: 25vw; padding-bottom: 45px; }
      .about-layout { grid-template-columns: 1fr; gap: 40px; }
      .about-copy { font-size: 25px; }
      .facts dd { font-size: 48px; }
      .footer { grid-template-columns: 1fr; gap: 20px; }
      .footer > div:last-child { justify-content: flex-start; }
      .lab-viewer-bar { padding: 14px 20px; gap: 12px; }
      .lab-viewer-title { font-size: 21px; }
      .lab-viewer-count { font-size: 13px; }
      .lab-viewer-bar button { padding: 10px 14px; }
      .lab-viewer-content { padding: 28px 20px 60px; }
      .gallery-intro { grid-template-columns: 1fr; gap: 20px; }
      .gallery-intro p { font-size: 20px; }
      .lab-viewer .swiss-frame { grid-template-columns: 1fr; gap: 15px; margin-bottom: 50px; }
      .swiss-frame .photo-number { font-size: 28px; }
      .swiss-overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 15px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    /* 玻璃只用于观看控件；默认实色作为不支持 backdrop 的回退。 */
    [data-glass-controls] {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(20,30,45,.06);
    }
    @supports ((backdrop-filter: blur(16px)) or (-webkit-backdrop-filter: blur(16px))) {
      [data-glass-controls] {
        background: var(--glass-fill);
        border-color: var(--glass-edge);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(20,30,45,.12), 0 2px 10px rgba(20,30,45,.06);
        -webkit-backdrop-filter: blur(16px) saturate(1.60);
        backdrop-filter: blur(16px) saturate(1.60);
      }
      [data-glass-controls] > div:first-child {
        background: var(--glass-title);
        border-radius: 8px;
      }
      [data-glass-controls] [data-close],
      [data-glass-controls] .theme-toggle,
      [data-glass-controls] .gallery-modes button:not([aria-pressed="true"]) {
        background: var(--glass-button);
      }
    }
    .lab-viewer-bar[data-glass-controls] {
      top: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      gap: 12px 20px;
      margin: 12px 40px 0;
      padding: 12px 16px;
    }
    [data-glass-controls] > div:first-child { min-width: 0; width: fit-content; max-width: 100%; padding: 6px 8px; }
    [data-glass-controls] .lab-viewer-title { font-size: 20px; line-height: 1.2; text-wrap: balance; }
    [data-glass-controls] .lab-viewer-count { display: block; margin-top: 4px; color: var(--glass-count); font-variant-numeric: tabular-nums; }
    [data-glass-controls] button:focus-visible { outline-width: 2px !important; outline-offset: 3px; }
    [data-glass-controls] [data-close] {
      grid-column: 4;
      grid-row: 1;
      min-width: 64px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 8px;
    }
    [data-glass-controls] .gallery-modes { grid-column: 2; grid-row: 1; gap: 4px; }
    [data-glass-controls] .gallery-modes button { padding: 8px 12px; border-radius: 8px; }
    @media (min-width: 601px) and (max-width: 800px) {
      .lab-viewer-bar[data-glass-controls] { grid-template-columns: minmax(0, 1fr) auto auto; }
      [data-glass-controls] [data-close] { grid-column: 3; }
      [data-glass-controls] .gallery-modes { grid-column: 1 / -1; grid-row: 2; }
    }
    @media (max-width: 600px) {
      .lab-viewer-bar[data-glass-controls] {
        grid-template-columns: minmax(0, 1fr) auto auto;
        margin: 12px 16px 0;
        padding: 10px 12px;
        gap: 8px 12px;
      }
      [data-glass-controls] [data-close] { grid-column: 3; }
      [data-glass-controls] .gallery-modes { grid-column: 1 / -1; grid-row: 2; }
      [data-glass-controls] .lab-viewer-title { font-size: 20px; }
      .lab-viewer .swiss-frame { scroll-margin-top: 160px; }
    }
    .nav { flex-wrap: wrap; }
    .nav .theme-toggle { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
    [data-glass-controls] .theme-toggle { grid-column: 3; grid-row: 1; min-height: 44px; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    :root[data-theme="dark"] [data-glass-controls] { box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -1px 0 rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.2); }
    @media (max-width: 800px) { [data-glass-controls] .theme-toggle { grid-column: 2; } }
    @media (max-width: 600px) { .nav { gap: 8px; } [data-glass-controls] .theme-toggle { padding: 8px; } }
  </style>
</head>
<body data-swiss-glass="controls">
  <a class="skip" href="#main">Skip to photographs</a>
  <div class="shell">
    <header class="masthead">
      <button class="identity" data-view="home" aria-label="Richard, home">Richard<span>Photography</span></button>
      <nav class="nav" aria-label="Main navigation">
        <button data-view="home" aria-current="page">Home</button>
        <button data-view="archive">Archive</button>
        <button data-view="places">Places</button>
        <button data-view="about">About</button>
        <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme">Dark</button>
      </nav>
    </header>
    <main id="main" tabindex="-1"><p class="load-state" role="status">Loading photographs…</p></main>
    <footer class="footer">
      <div><p>Photography by Richard</p><p id="footer-count">A photographic archive.</p></div>
      <div><button data-view="archive">All collections</button><button data-view="places">Browse places</button><button data-top>Back to top</button></div>
    </footer>
  </div>
  <script src="/common.js"></script>
  <script>
    window.DesignLab.ready.then(data => {
      const { escape: esc, image } = window.DesignLab;

      const main = document.querySelector('main');
      const viewer = document.querySelector('.lab-viewer');
      const viewerBar = viewer.querySelector('.lab-viewer-bar');
      viewerBar.setAttribute('data-glass-controls', '');
      const viewerTheme = document.createElement('button');
      viewerTheme.className = 'theme-toggle';
      viewerTheme.setAttribute('data-theme-toggle', '');
      viewerBar.append(viewerTheme);
      function syncTheme() {
        const dark = document.documentElement.dataset.theme === 'dark';
        document.querySelectorAll('[data-theme-toggle]').forEach(button => {
          button.textContent = dark ? 'Light' : 'Dark';
          button.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} theme`);
          button.setAttribute('aria-pressed', String(dark));
        });
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111111' : '#ffffff';
      }
      syncTheme();
      document.addEventListener('click', event => {
        if (!event.target.closest('[data-theme-toggle]')) return;
        themePreference = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('photography-swiss-theme', themePreference);
        document.documentElement.dataset.theme = themePreference;
        syncTheme();
      });
      themeMedia.addEventListener('change', event => {
        if (themePreference === 'light' || themePreference === 'dark') return;
        document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
        syncTheme();
      });

      // 公共 dialog 完成渲染后移动原模式控件，保留现有 data-mode 契约。
      new MutationObserver(() => {
        const modes = viewer.querySelector('.swiss-gallery .gallery-modes');
        if (modes) {
          viewerBar.querySelector('.gallery-modes')?.remove();
          viewerBar.append(modes);
        }
      }).observe(viewer, { attributes: true, attributeFilter: ['open'] });
      const archive = [...data.archive].sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
      const years = [...new Set(archive.map(g => g.date.slice(0, 4)))];
      const places = new Map();
      archive.forEach(g => g.places.forEach(p => {
        if (!places.has(p.id)) places.set(p.id, { ...p, galleries: [] });
        if (!places.get(p.id).galleries.some(item => item.id === g.id)) places.get(p.id).galleries.push(g);
      }));
      const placeList = [...places.values()].sort((a, b) => a.title.localeCompare(b.title));
      const photoCount = new Set(archive.flatMap(g => g.photos.map(p => p.id))).size;
      let year = 'all';
      let placeId = placeList[0]?.id;
      let view = 'home';

      const placeText = g => g.places.map(p => p.title).join(', ');
      const galleryButton = g => `data-gallery="${esc(g.id)}"`;
      const card = (g, eager = false) => `<button class="collection" ${galleryButton(g)} aria-label="Open ${esc(g.title)}"><span class="picture">${image(g.cover, '(max-width: 600px) 90vw, (max-width: 900px) 45vw, 30vw', eager)}</span><span class="collection-title">${esc(g.title)}</span><span class="collection-meta"><span>${esc(g.date)}</span><span>${g.count} photographs</span></span></button>`;
      const pageHead = (title, copy) => `<header class="page-head"><h1>${title}</h1><p>${copy}</p></header>`;

      function home() {
        const featured = data.galleries[0];
        return `<section class="view"><div class="section-line"><span>Photography by Richard</span><span>${archive.length} collections</span></div>
          <div class="hero"><h1 class="hero-title">Photo<br>graphy.</h1>
            <figure class="hero-image"><button ${galleryButton(featured)} aria-label="Open ${esc(featured.title)}">${image(featured.cover, '(max-width: 600px) 75vw, 48vw', true)}</button><figcaption><span>${esc(featured.title)}</span><button ${galleryButton(featured)}>View collection</button></figcaption></figure>
            <p class="hero-note">A collection of photographs.<br>Look closely. Take your time.</p>
            <div class="hero-meta"><span>${esc(placeText(featured))}</span><time datetime="${esc(featured.date)}">${esc(featured.date)}</time></div>
          </div><section class="selected"><div class="selected-heading"><h2>Selected work</h2><button class="text-link" data-view="archive">Browse the archive</button></div><div class="selected-grid">${data.galleries.map(g => card(g)).join('')}</div></section></section>`;
      }

      function archiveView() {
        const filtered = archive.filter(g => year === 'all' || g.date.startsWith(year));
        return `<section class="view">${pageHead('Archive.', 'Every published collection, ordered by the date it was photographed. Most recent first.')}
          <div class="filter-row" aria-label="Filter by photographed year"><span>Year</span>${['all', ...years].map(y => `<button class="filter" data-year="${esc(y)}" aria-pressed="${year === y}">${y === 'all' ? 'All years' : esc(y)}</button>`).join('')}<span class="result-count" role="status">${filtered.length} collections</span></div>
          <table class="archive-table"><caption class="sr-only">Collections by photographed date</caption><colgroup><col><col><col><col><col></colgroup><thead><tr><th scope="col">Preview</th><th scope="col">Collection</th><th scope="col">Photographed</th><th scope="col">Places</th><th scope="col">Photos</th></tr></thead><tbody>${filtered.map(g => `<tr><td><button class="archive-thumb" ${galleryButton(g)} aria-label="Open ${esc(g.title)}">${image(g.cover, '92px')}</button></td><td><button class="archive-name" ${galleryButton(g)}>${esc(g.title)}</button><span class="archive-mobile-place">${esc(placeText(g))}<br>${g.count} photographs</span></td><td class="archive-date"><time datetime="${esc(g.date)}">${esc(g.date)}</time></td><td class="archive-places">${esc(placeText(g))}</td><td>${g.count}</td></tr>`).join('')}</tbody></table></section>`;
      }

      function placesView() {
        const selected = places.get(placeId);
        return `<section class="view">${pageHead('Places.', 'An index of the places attached to these collections. Choose a place to see its photographs.')}
          <div class="place-layout"><nav class="place-directory" aria-label="Place index">${placeList.map(p => `<button class="place-button" data-place="${esc(p.id)}" aria-pressed="${p.id === placeId}" aria-controls="place-results"><span>${esc(p.title)}</span><small>${p.galleries.length}</small></button>`).join('')}</nav>
            <section class="place-results" id="place-results" aria-label="Collections at selected place">${selected ? `<h2>${esc(selected.title)}</h2><p role="status">${selected.galleries.length} collections</p><div class="selected-grid">${selected.galleries.map(g => card(g)).join('')}</div>` : '<p>No places are listed in the archive.</p>'}</section></div></section>`;
      }

      function about() {
        return `<section class="view"><div class="section-line"><span>About</span><span>Photography</span></div><h1 class="about-name">Richard.</h1>
          <div class="about-layout"><div class="about-copy"><p>Photography by Richard.</p><p>This archive brings published collections together by date and place. Each collection follows its original photographic sequence.</p><div class="about-actions"><button class="text-link" data-view="archive">Explore all collections</button><button class="text-link" data-view="places">Explore by place</button></div></div>
          <dl class="facts"><div><dt>Published collections</dt><dd>${archive.length}</dd></div><div><dt>Photographs</dt><dd>${photoCount}</dd></div><div><dt>Places in the archive</dt><dd>${placeList.length}</dd></div></dl></div></section>`;
      }

      const views = { home, archive: archiveView, places: placesView, about };

      function render(next, focus = false) {
        view = Object.hasOwn(views, next) ? next : 'home';
        main.innerHTML = views[view]();
        document.querySelectorAll('.nav [data-view]').forEach(button => {
          if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        document.title = `Richard — ${view === 'home' ? 'Photography' : view[0].toUpperCase() + view.slice(1)} / Swiss`;
        if (focus) {
          main.focus({ preventScroll: true });
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
      }

      window.DesignLab.renderGallery = g => `<div class="swiss-gallery"><h1 class="gallery-title">${esc(g.title)}</h1><div class="gallery-intro"><aside>Photographed ${esc(g.date)}<br>${esc(placeText(g))}<br>${g.count} photographs</aside><p>${esc(g.description)}</p></div>
        <div class="gallery-tools"><span>Original photographic sequence</span><div class="gallery-modes" aria-label="Photograph layout"><button data-mode="sequence" aria-pressed="true">Sequence</button><button data-mode="overview" aria-pressed="false">Overview</button></div></div>
        <div class="swiss-overview" hidden>${g.photos.map((p, i) => `<button class="overview-photo" data-photo="${i}" aria-label="View photograph ${i + 1}: ${esc(p.alt)}">${image(p, '(max-width: 600px) 42vw, 22vw')}<span>${String(i + 1).padStart(2, '0')} / ${g.count}</span></button>`).join('')}</div>
        <div class="lab-viewer-sequence swiss-sequence">${g.photos.map((p, i) => `<figure class="swiss-frame" id="swiss-photo-${i}" data-photo-id="${esc(p.id)}" tabindex="-1"><span class="photo-number">${String(i + 1).padStart(2, '0')}</span><div>${image(p, '(max-width: 600px) 90vw, 78vw', i === 0)}<figcaption>${esc(p.caption)}</figcaption></div></figure>`).join('')}</div>
        <div class="gallery-end"><span>${g.count} photographs / ${esc(g.title)}</span><button class="text-link" data-gallery-top>Back to collection top</button></div></div>`;

      function changeMode(root, mode) {
        root.querySelector('.swiss-sequence').hidden = mode !== 'sequence';
        root.querySelector('.swiss-overview').hidden = mode !== 'overview';
        root.closest('dialog').querySelectorAll('[data-mode]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
        });
      }

      document.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.view) {
          const next = button.dataset.view;
          if (location.hash === `#${next}`) render(next, true);
          else location.hash = next;
        }
        if (button.dataset.year) {
          year = button.dataset.year;
          render('archive');
          [...main.querySelectorAll('[data-year]')].find(b => b.dataset.year === year)?.focus();
        }
        if (button.dataset.place) {
          placeId = button.dataset.place;
          render('places');
          [...main.querySelectorAll('[data-place]')].find(b => b.dataset.place === placeId)?.focus();
        }
        if (button.hasAttribute('data-top')) {
          window.scrollTo({ top: 0, behavior: 'instant' });
          }

        const root = button.closest('.swiss-gallery') || button.closest('.lab-viewer-bar')?.closest('dialog').querySelector('.swiss-gallery');
        if (root && button.dataset.mode) {
          changeMode(root, button.dataset.mode);
          viewer.scrollTo({ top: 0, behavior: 'instant' });
        }
        if (root && button.hasAttribute('data-photo')) {
          changeMode(root, 'sequence');
          const target = root.querySelector(`#swiss-photo-${button.dataset.photo}`);
          target.style.scrollMarginTop = `${viewerBar.getBoundingClientRect().height + 24}px`;
          target.focus({ preventScroll: true });
          target.scrollIntoView({ block: 'start', behavior: 'instant' });
        }
        if (button.hasAttribute('data-gallery-top')) {
          button.closest('dialog').scrollTo({ top: 0, behavior: 'instant' });
        }
      });

      document.querySelector('.skip').addEventListener('click', event => {
        event.preventDefault();
        main.focus({ preventScroll: true });
        main.scrollIntoView({ block: 'start', behavior: 'instant' });
      });

      window.addEventListener('hashchange', () => {
        render(location.hash.slice(1), true);
      });
      document.querySelector('#footer-count').textContent = `${archive.length} collections / ${photoCount} photographs`;
      render(location.hash.slice(1));
    }).catch(() => {
      document.querySelector('main').innerHTML = '<p class="load-state" role="alert">The photographs could not be loaded. Reload this page to try again.</p>';
    });
  </script>
</body>
</html>
