<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Richard Photographs</title>
  <script>
    // Apply the theme before first paint so dark mode never flashes white.
    (() => {
      const stored = localStorage.getItem('audit-a-refine-theme');
      const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/common.css">
  <style>
    /* common.css only ships Lab Sans 400; the 600 cut carries Swiss headings. */
    @font-face {
      font-family: 'Lab Sans';
      src: url('/fonts/source-sans-3/source-sans-3-latin-600.3b487916.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      /* Type scale — one step per role, nothing in between. */
      --text-display: clamp(44px, 6.6vw, 92px);
      --text-title: clamp(26px, 3vw, 36px);
      --text-lead: 20px;
      --text-body: 16px;
      --text-meta: 13px;
      /* Spacing scale — every block rhythm reads from this ladder. */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 40px;
      --space-5: 64px;
      --space-6: clamp(88px, 9vw, 128px);
      /* Color */
      --bg: #ffffff;
      --ink: #1a1a1a;
      --quiet: #6f6f6f;
      --line: #e4e4e4;
      --viewer-bg: var(--bg);
      --viewer-ink: var(--ink);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141414;
      --ink: #ececec;
      --quiet: #9c9c9c;
      --line: #303030;
    }

    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Lab Sans', 'Source Sans 3', system-ui, sans-serif;
      font-size: var(--text-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-meta); letter-spacing: .01em; }
    h1, h2, h3, p, figure, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    a { text-decoration-thickness: 1px; text-underline-offset: 4px; }
    button { border: 0; background: none; padding: 0; text-align: left; color: inherit; }
    :focus-visible { outline: 2px solid var(--ink) !important; outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }

    .shell { max-width: 1280px; margin-inline: auto; padding-inline: var(--space-4); }

    .skip { position: fixed; top: -100px; left: var(--space-2); z-index: 10; padding: var(--space-1) var(--space-2); background: var(--bg); border: 1px solid var(--ink); }
    .skip:focus-visible { top: var(--space-2); }

    /* ——— Masthead: brand zone left, control zone right, one strong rule below. ——— */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      padding-block: var(--space-3);
      border-bottom: 2px solid var(--ink);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.01em;
      text-decoration: none;
    }
    .masthead-controls { display: flex; align-items: center; gap: var(--space-4); }
    .nav { display: flex; align-items: center; gap: var(--space-3); }
    .nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: var(--text-body);
      color: var(--quiet);
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    .nav a:hover { color: var(--ink); }
    .nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
    /* The divider makes the theme control its own zone instead of hugging the brand. */
    .masthead-divider { width: 1px; height: 20px; background: var(--line); }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      min-height: 44px;
      padding-inline: var(--space-2);
      border: 1px solid var(--line);
      color: var(--quiet);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: var(--text-meta);
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--ink); }

    main { min-height: 60vh; }
    /* main only takes programmatic focus (skip link / route change); the outline belongs to interactive elements. */
    #main:focus { outline: none !important; }
    .load-state { padding-block: var(--space-6); color: var(--quiet); }

    /* ——— Section head: 2px rule, title left, real information right. ——— */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      border-top: 2px solid var(--ink);
      padding-top: var(--space-2);
    }
    .section-head h1, .section-head h2 { font-size: var(--text-title); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
    .section-note { color: var(--quiet); font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-meta); text-align: right; text-wrap: balance; }

    /* ——— Home hero: the single display moment of the page. ——— */
    .hero { padding-top: var(--space-5); }
    .hero-meta { color: var(--quiet); }
    .hero-title {
      margin-top: var(--space-2);
      font-size: var(--text-display);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -.035em;
      text-wrap: balance;
      max-width: 12ch;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: var(--space-3);
      margin-top: var(--space-4);
      align-items: end;
    }
    .hero-figure { grid-column: 1 / 9; min-width: 0; }
    .hero-figure button { display: block; width: 100%; }
    .hero-figure img { width: 100%; height: auto; }
    .hero-figure figcaption {
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
      margin-top: var(--space-2);
      padding-top: var(--space-1);
      border-top: 1px solid var(--line);
      color: var(--quiet);
    }
    .hero-aside { grid-column: 9 / 13; min-width: 0; }
    .hero-description { font-size: var(--text-lead); line-height: 1.45; max-width: 34ch; }
    .cta {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: var(--space-3);
      font-size: var(--text-body);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }
    .cta:hover { color: var(--quiet); }
    .cta .arrow { margin-left: var(--space-1); }

    /* ——— Selected journeys. ——— */
    .journeys { margin-top: var(--space-6); }
    .journey-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: var(--space-3);
      row-gap: var(--space-5);
      margin-top: var(--space-4);
    }
    .journey { display: block; width: 100%; }
    .journey-cover { display: block; }
    .journey-cover img { width: 100%; height: auto; }
    .journey-name {
      display: block;
      margin-top: var(--space-2);
      padding-top: var(--space-1);
      border-top: 1px solid var(--ink);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.25;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 5px;
    }
    .journey:hover .journey-name { text-decoration-color: var(--ink); }
    .journey-meta {
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
      margin-top: var(--space-1);
      color: var(--quiet);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: var(--text-meta);
      font-variant-numeric: tabular-nums;
    }

    /* ——— Closure: the wall always ends at an exit, never at dead space. ——— */
    .section-close {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      margin-top: var(--space-5);
      border-top: 1px solid var(--line);
      padding-top: var(--space-2);
    }
    .section-close p { color: var(--quiet); }
    .section-close .cta { margin-top: 0; flex-shrink: 0; }

    /* ——— Archive: a quiet table, latest first. ——— */
    .archive { padding-top: var(--space-5); }
    .archive-table { width: 100%; margin-top: var(--space-4); border-collapse: collapse; }
    .archive-table th {
      padding-block: var(--space-1);
      border-bottom: 1px solid var(--ink);
      color: var(--quiet);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: var(--text-meta);
      font-weight: 400;
      text-align: left;
    }
    .archive-table td { padding-block: var(--space-2); border-bottom: 1px solid var(--line); vertical-align: baseline; }
    .archive-table th:last-child, .archive-table td:last-child { text-align: right; }
    .archive-table td + td, .archive-table th + th { padding-left: var(--space-3); }
    .archive-title-button { font-size: 18px; font-weight: 600; letter-spacing: -.01em; min-height: 44px; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 5px; }
    .archive-title-button:hover { text-decoration-color: var(--ink); }
    .archive-mobile-meta { display: none; }
    .nobr { white-space: nowrap; }
    .archive-places { color: var(--quiet); max-width: 40ch; }
    .archive-date, .archive-count { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-meta); font-variant-numeric: tabular-nums; }
    .archive-date { color: var(--quiet); }

    /* ——— Footer: brand line, quiet links, one meta line. No label stacks. ——— */
    .colophon { margin-top: var(--space-6); border-top: 2px solid var(--ink); padding-block: var(--space-3) var(--space-4); }
    .colophon-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .colophon-brand { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .colophon-nav { display: flex; align-items: center; gap: var(--space-3); }
    .colophon-nav a, .colophon-nav button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--quiet);
      font-size: var(--text-body);
      text-decoration: none;
    }
    .colophon-nav a:hover, .colophon-nav button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
    .colophon-meta { margin-top: var(--space-1); color: var(--quiet); }

    /* ——— Viewer (common.js dialog) restyled to the same hairline language. ——— */
    .lab-viewer-bar { padding: var(--space-2) var(--space-4); border-bottom: 2px solid var(--ink); }
    .lab-viewer-title { font-size: var(--text-lead); font-weight: 600; letter-spacing: -.01em; }
    .lab-viewer-count { display: block; margin-top: 2px; color: var(--quiet); font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-meta); }
    .lab-viewer-bar button { min-height: 44px; padding-inline: var(--space-2); border: 1px solid var(--line); }
    .lab-viewer-bar button:hover { border-color: var(--ink); }
    .lab-viewer-content { padding: var(--space-4) var(--space-4) var(--space-6); }
    .lab-viewer-description { font-size: var(--text-lead); line-height: 1.45; }
    .lab-viewer figure { margin-bottom: var(--space-5); }
    .lab-viewer figcaption { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-meta); color: var(--quiet); }

    /* ——— Responsive ——— */
    @media (max-width: 900px) {
      .shell { padding-inline: var(--space-3); }
      .hero-figure { grid-column: 1 / 13; }
      .hero-aside { grid-column: 1 / 10; margin-top: var(--space-2); }
      .journey-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .archive-places { max-width: 28ch; }
    }
    @media (max-width: 600px) {
      .shell { padding-inline: var(--space-2); }
      .masthead { flex-direction: column; align-items: stretch; gap: var(--space-1); padding-block: var(--space-2); }
      .masthead-controls { justify-content: space-between; gap: var(--space-2); }
      .masthead-divider { display: none; }
      .nav { gap: var(--space-2); }
      .hero { padding-top: var(--space-4); }
      .hero-title { max-width: none; }
      .hero-grid { grid-template-columns: 1fr; gap: var(--space-3); }
      .hero-figure, .hero-aside { grid-column: 1; }
      .hero-description { max-width: none; }
      .journeys, .colophon { margin-top: var(--space-5); }
      .journey-grid { grid-template-columns: 1fr; row-gap: var(--space-4); }
      .section-close { flex-direction: column; align-items: flex-start; gap: var(--space-1); }
      .archive-table th:nth-child(2), .archive-table td:nth-child(2),
      .archive-table th:nth-child(3), .archive-table td:nth-child(3) { display: none; }
      .archive-mobile-meta { display: block; margin-top: 2px; color: var(--quiet); font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-meta); font-weight: 400; }
      .archive-table td + td, .archive-table th + th { padding-left: var(--space-2); }
      .colophon-top { flex-direction: column; align-items: flex-start; gap: 0; }
      .colophon-nav { gap: var(--space-2); }
      .lab-viewer-bar { padding-inline: var(--space-2); }
      .lab-viewer-content { padding-inline: var(--space-2); }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="#home">Richard Photographs</a>
      <div class="masthead-controls">
        <nav class="nav" aria-label="Main">
          <a href="#home" data-nav="home" aria-current="page">Home</a>
          <a href="#archive" data-nav="archive">Archive</a>
        </nav>
        <span class="masthead-divider" aria-hidden="true"></span>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">Dark</button>
      </div>
    </header>
    <main id="main" tabindex="-1"><p class="load-state" role="status">Loading photographs…</p></main>
    <footer class="colophon">
      <div class="colophon-top">
        <p class="colophon-brand">Richard Photographs</p>
        <nav class="colophon-nav" aria-label="Footer">
          <a href="#home">Home</a>
          <a href="#archive">Archive</a>
          <button type="button" data-top>Back to top</button>
        </nav>
      </div>
      <p class="colophon-meta mono" data-colophon-meta>Photographs by Richard.</p>
    </footer>
  </div>
  <script src="/common.js"></script>
  <script>
    window.DesignLab.ready.then(data => {
      const { escape: esc, image } = window.DesignLab;
      const main = document.getElementById('main');
      const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const monthYear = date => `${MONTHS[Number(date.slice(5, 7)) - 1]} ${date.slice(0, 4)}`;
      const placeText = g => g.places.map(p => p.title).join(', ');
      const archive = [...data.archive].sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
      const photoCount = new Set(archive.flatMap(g => g.photos.map(p => p.id))).size;
      const years = archive.map(g => g.date.slice(0, 4));
      const yearRange = `${Math.min(...years)}–${Math.max(...years)}`;

      // Theme toggle — text-labeled so the control explains itself.
      const toggle = document.querySelector('[data-theme-toggle]');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const syncTheme = () => {
        const dark = document.documentElement.dataset.theme === 'dark';
        toggle.textContent = dark ? 'Light' : 'Dark';
        toggle.setAttribute('aria-pressed', String(dark));
        toggle.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} theme`);
        themeColor.content = dark ? '#141414' : '#ffffff';
      };
      toggle.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('audit-a-refine-theme', next);
        syncTheme();
      });
      syncTheme();

      const card = g => `
        <li>
          <button class="journey" type="button" data-gallery="${esc(g.id)}" aria-label="Open ${esc(g.title)}">
            <span class="journey-cover">${image(g.cover, '(max-width: 600px) calc(100vw - 32px), (max-width: 900px) calc(50vw - 32px), 389px')}</span>
            <span class="journey-name">${esc(g.title)}</span>
            <span class="journey-meta"><span>${esc(monthYear(g.date))}</span><span>${g.count} photographs</span></span>
          </button>
        </li>`;

      function home() {
        const featured = data.galleries[0];
        return `
          <section class="hero" aria-labelledby="hero-title">
            <p class="hero-meta mono">Latest journey — ${esc(placeText(featured))} · ${esc(monthYear(featured.date))} · ${featured.count} photographs</p>
            <h1 class="hero-title" id="hero-title">${esc(featured.title)}</h1>
            <div class="hero-grid">
              <figure class="hero-figure">
                <button type="button" data-gallery="${esc(featured.id)}" aria-label="Open ${esc(featured.title)}">${image(featured.cover, '(max-width: 900px) calc(100vw - 32px), 672px', true)}</button>
                <figcaption class="mono"><span>${esc(featured.cover.caption || featured.title)}</span><span>Cover</span></figcaption>
              </figure>
              <div class="hero-aside">
                <p class="hero-description">${esc(featured.description)}</p>
                <button class="cta" type="button" data-gallery="${esc(featured.id)}">View the journey<span class="arrow" aria-hidden="true">→</span></button>
              </div>
            </div>
          </section>
          <section class="journeys" aria-labelledby="journeys-title">
            <header class="section-head">
              <h2 id="journeys-title">Selected journeys</h2>
              <p class="section-note">Latest first · ${data.galleries.length} journeys</p>
            </header>
            <ul class="journey-grid">${data.galleries.map(card).join('')}</ul>
            <footer class="section-close">
              <p>The archive holds ${archive.length} journeys and ${photoCount} photographs, ${yearRange}.</p>
              <a class="cta" href="#archive">Browse the full archive<span class="arrow" aria-hidden="true">→</span></a>
            </footer>
          </section>`;
      }

      function archiveView() {
        return `
          <section class="archive" aria-labelledby="archive-title">
            <header class="section-head">
              <h1 id="archive-title">Archive</h1>
              <p class="section-note">${archive.length} journeys · ${photoCount} photographs · ${yearRange}</p>
            </header>
            <table class="archive-table">
              <caption class="sr-only">Every published journey, latest first</caption>
              <thead><tr><th scope="col">Journey</th><th scope="col">Places</th><th scope="col">Photographed</th><th scope="col">Photos</th></tr></thead>
              <tbody>
                ${archive.map(g => `
                  <tr>
                    <td><button class="archive-title-button" type="button" data-gallery="${esc(g.id)}">${esc(g.title)}</button><span class="archive-mobile-meta">${esc(placeText(g))} · <span class="nobr">${esc(g.date)}</span></span></td>
                    <td class="archive-places">${esc(placeText(g))}</td>
                    <td class="archive-date"><time datetime="${esc(g.date)}">${esc(g.date)}</time></td>
                    <td class="archive-count">${g.count}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </section>`;
      }

      const views = { home, archive: archiveView };

      function render(name, focus = false) {
        const view = Object.hasOwn(views, name) ? name : 'home';
        main.innerHTML = views[view]();
        document.title = view === 'home' ? 'Richard Photographs' : `Archive — Richard Photographs`;
        document.querySelectorAll('[data-nav]').forEach(link => {
          if (link.dataset.nav === view) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
        if (focus) {
          window.scrollTo({ top: 0, behavior: 'instant' });
          main.focus({ preventScroll: true });
        }
      }

      window.addEventListener('hashchange', () => render(location.hash.slice(1), true));

      document.addEventListener('click', event => {
        if (event.target.closest('[data-top]')) window.scrollTo({ top: 0, behavior: 'instant' });
      });

      // The shared viewer speaks the same language: quiet description, numbered plates.
      window.DesignLab.renderGallery = g => `
        <p class="lab-viewer-description">${esc(g.description)}</p>
        <div class="lab-viewer-sequence">
          ${g.photos.map((p, i) => `
            <figure>
              ${image(p, '(max-width: 600px) calc(100vw - 32px), 90vw', i === 0)}
              <figcaption><span>${esc(p.caption)}</span><span>${String(i + 1).padStart(2, '0')} / ${g.count}</span></figcaption>
            </figure>`).join('')}
        </div>`;

      document.querySelector('[data-colophon-meta]').textContent =
        `Photographs by ${data.author} · ${archive.length} journeys · ${photoCount} photographs`;
      render(location.hash.slice(1));
    }).catch(() => {
      document.getElementById('main').innerHTML =
        '<p class="load-state" role="alert">The photographs could not be loaded. Reload this page to try again.</p>';
    });
  </script>
</body>
</html>
