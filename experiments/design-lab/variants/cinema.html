<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Cinema — Photography by Richard</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    :root { color-scheme: dark; }
    body {
      --viewer-bg: #000000;
      --viewer-ink: #eeeae2;
      background: #000;
      color: #eeeae2;
      font-family: 'Lab Sans', sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }
    button, select { font: inherit; }
    button { border: 0; background: none; }
    a { text-underline-offset: 5px; }
    button, a, select { touch-action: manipulation; }
    :focus-visible { outline: 2px solid #d9c699 !important; outline-offset: 5px; }
    .skip { position: fixed; top: -100px; left: 20px; z-index: 10; padding: 12px; background: #151719; }
    .skip:focus { top: 12px; }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 4vw;
      border-bottom: 1px solid #292b2d;
    }
    .identity { padding: 0; text-align: left; line-height: 1.25; }
    .identity strong { display: block; font-family: 'Lab Serif', serif; font-weight: 400; font-size: 26px; }
    .identity span { color: #a9aaa7; font-size: 13px; }
    nav { display: flex; gap: 24px; flex-wrap: wrap; }
    nav button { padding: 10px 0; color: #a9aaa7; border-bottom: 1px solid transparent; }
    nav button[aria-current="page"] { color: #eeeae2; border-bottom-color: #d9c699; }
    nav button:hover, .identity:hover { color: #d9c699; }
    main { min-height: 70vh; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: 'Lab Serif', serif; font-weight: 400; }
    h1 { font-size: clamp(36px, 5.5vw, 76px); line-height: 1.06; overflow-wrap: anywhere; }
    h2 { font-size: clamp(25px, 3vw, 42px); line-height: 1.15; }
    .muted { color: #a9aaa7; }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 22px;
      border: 1px solid #777972;
      background: #151719;
      border-radius: 2px;
      white-space: nowrap;
    }
    .action:hover { background: #eeeae2; color: #000; }
    .stage { padding: 24px 4vw 0; }
    .screen {
      height: min(62vw, 64vh);
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .screen img { width: 100%; height: 100%; object-fit: contain; }
    .screen-caption {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 26px 0 30px;
    }
    .screen-caption h1 { font-size: clamp(32px, 4vw, 58px); }
    .screen-caption .muted { margin-top: 10px; }
    .stage-intro { display: flex; justify-content: space-between; gap: 20px; padding: 15px 0 5px; }
    .stage-intro p { font-size: 14px; color: #a9aaa7; }
    .program { margin: 0 4vw 60px; padding-top: 24px; border-top: 1px solid #292b2d; }
    .program-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .program-heading h2 { font-family: 'Lab Sans', sans-serif; font-size: 18px; }
    .program-heading span { font-size: 14px; color: #a9aaa7; }
    .reel { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
    .reel button { min-width: 0; text-align: left; padding: 0 0 12px; border-bottom: 2px solid transparent; }
    .reel button[aria-pressed="true"] { border-bottom-color: #d9c699; }
    .reel img { width: 100%; height: 108px; object-fit: contain; background: #151719; }
    .reel-title { display: block; margin: 10px 0 3px; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
    .reel-date { color: #a9aaa7; font-size: 13px; }
    .reel button:hover .reel-title { color: #d9c699; }
    .page { padding: 62px 6vw 90px; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 44px; }
    .page-head p { max-width: 45ch; color: #a9aaa7; margin-top: 18px; }
    .year-control { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    select { color: #eeeae2; padding: 11px 32px 11px 14px; background: #151719; border: 1px solid #777972; border-radius: 2px; }
    .library { border-top: 1px solid #292b2d; }
    .film {
      width: 100%;
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) auto;
      align-items: center;
      gap: 32px;
      padding: 26px 0;
      border-bottom: 1px solid #292b2d;
      text-align: left;
    }
    .film img { width: 210px; height: 135px; object-fit: contain; background: #151719; }
    .film h2 { font-size: clamp(26px, 3vw, 40px); }
    .film p { margin-top: 12px; color: #a9aaa7; font-size: 15px; }
    .film-end { text-align: right; color: #a9aaa7; font-size: 14px; }
    .film-end strong { display: block; color: #eeeae2; font-weight: 400; font-size: 17px; margin-top: 12px; }
    .film:hover h2, .film:hover .film-end strong { color: #d9c699; }
    .archive-count { margin: 0 0 18px; color: #a9aaa7; font-size: 14px; }
    .locations { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 6vw; }
    .place-menu { display: flex; flex-direction: column; align-self: start; border-top: 1px solid #292b2d; }
    .place-menu button { display: flex; justify-content: space-between; gap: 15px; padding: 18px 12px; border-bottom: 1px solid #292b2d; text-align: left; }
    .place-menu button[aria-pressed="true"] { background: #eeeae2; color: #000; }
    .place-menu button:hover { box-shadow: inset 3px 0 #d9c699; }
    .place-menu span { font-size: 14px; }
    .location-heading { margin-bottom: 22px; }
    .location-heading p { margin-top: 10px; color: #a9aaa7; }
    .location-films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 24px; }
    .location-film { padding: 0; text-align: left; min-width: 0; }
    .location-film img { width: 100%; height: 230px; object-fit: contain; background: #151719; }
    .location-film h3 { font-size: 25px; line-height: 1.15; margin: 16px 0 8px; overflow-wrap: anywhere; }
    .location-film p { color: #a9aaa7; font-size: 14px; }
    .location-film:hover h3 { color: #d9c699; }
    .credits { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 7vw; align-items: center; }
    .credits-image img { width: 100%; max-height: 65vh; object-fit: contain; }
    .credits-copy h1 { font-size: clamp(38px, 5vw, 70px); }
    .credits-copy > p { max-width: 42ch; margin-top: 24px; color: #a9aaa7; font-size: 19px; }
    .credits-data { display: flex; gap: 36px; margin: 34px 0; padding: 24px 0; border-block: 1px solid #292b2d; }
    .credits-data div { min-width: 0; }
    .credits-data dt { color: #a9aaa7; font-size: 14px; }
    .credits-data dd { margin: 6px 0 0; font-family: 'Lab Serif', serif; font-size: 34px; }
    .image-credit { margin-top: 18px; color: #a9aaa7; font-size: 14px; }
    footer { margin: 0 4vw; padding: 28px 0; border-top: 1px solid #292b2d; display: flex; justify-content: space-between; gap: 24px; font-size: 14px; color: #a9aaa7; }
    footer button { color: #eeeae2; padding: 0; text-decoration: underline; text-underline-offset: 5px; }
    .loading { padding: 12vh 6vw; color: #a9aaa7; }
    .lab-viewer-bar { padding: 16px 4vw; border-color: #292b2d; }
    .lab-viewer-title { font-family: 'Lab Serif', serif; overflow-wrap: anywhere; }
    .lab-viewer-count { color: #a9aaa7; }
    .lab-viewer-bar button { border-color: #777972; border-radius: 2px; }
    .lab-viewer-content { padding: 28px 4vw 70px; }
    .cinema-tools { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin: 0 auto 36px; max-width: 1320px; }
    .cinema-tools p { max-width: 65ch; color: #a9aaa7; }
    .cinema-tools h1 { font-size: 28px; margin-bottom: 12px; }
    .view-modes { display: flex; gap: 4px; flex-shrink: 0; background: #151719; padding: 4px; border-radius: 3px; }
    .view-modes button { padding: 10px 16px; min-height: 44px; border-radius: 2px; }
    .view-modes button[aria-pressed="true"] { background: #eeeae2; color: #000; }
    .cinema-frames { max-width: 1320px; margin: auto; }
    .cinema-frames figure { margin: 0 0 90px; scroll-margin-top: 110px; }
    .cinema-frames figure img { width: 100%; height: auto; max-height: 80dvh; object-fit: contain; }
    .cinema-frames figcaption { max-width: none; padding-top: 14px; color: #a9aaa7; border-top: 1px solid #292b2d; }
    .frame-open { display: block; width: 100%; padding: 0; cursor: default; }
    .frame-open:disabled { color: inherit; }
    .cinema-frames.overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 38px 24px; }
    .cinema-frames.overview figure { margin: 0; min-width: 0; }
    .cinema-frames.overview img { height: 230px; object-fit: contain; background: #151719; }
    .cinema-frames.overview .frame-open { cursor: pointer; }
    .cinema-frames.overview .frame-open:hover { outline: 1px solid #d9c699; }
    .cinema-frames figcaption span:last-child { white-space: nowrap; }
    @media (min-width: 1600px) {
      .stage, .program { max-width: 1600px; margin-inline: auto; }
      .page { max-width: 1600px; margin-inline: auto; }
    }
    @media (max-width: 850px) {
      .masthead { gap: 16px; }
      nav { gap: 18px; }
      .reel { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 16px; }
      .film { grid-template-columns: 150px minmax(0, 1fr); gap: 22px; }
      .film img { width: 150px; height: 115px; }
      .film-end { display: none; }
      .locations { grid-template-columns: 190px minmax(0, 1fr); gap: 24px; }
      .location-films { grid-template-columns: 1fr; }
      .credits { gap: 32px; }
      .credits-data { gap: 20px; }
      .cinema-tools { flex-direction: column; align-items: start; }
      .cinema-frames.overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .masthead { flex-direction: column; align-items: start; padding: 18px 6vw 8px; }
      .identity strong { font-size: 23px; }
      nav { width: 100%; justify-content: space-between; gap: 8px; }
      nav button { min-height: 44px; font-size: 15px; }
      .stage { padding: 22px 0 0; }
      .stage-intro { padding: 0 6vw 14px; }
      .screen { height: 46vh; min-height: 240px; }
      .screen-caption { padding: 24px 6vw 30px; grid-template-columns: 1fr; gap: 20px; }
      .screen-caption .action { justify-self: start; }
      .program { margin: 0 6vw 44px; }
      .program-heading { align-items: start; }
      .program-heading span { max-width: 13ch; text-align: right; }
      .reel { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
      .reel img { height: 105px; }
      .page { padding: 38px 6vw 60px; }
      .page-head { flex-direction: column; align-items: start; gap: 26px; margin-bottom: 30px; }
      .film { grid-template-columns: 100px minmax(0, 1fr); gap: 18px; padding: 22px 0; }
      .film img { width: 100px; height: 100px; }
      .film h2 { font-size: 25px; overflow-wrap: anywhere; }
      .film p { font-size: 13px; margin-top: 8px; }
      .locations { grid-template-columns: 1fr; gap: 34px; }
      .place-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .place-menu button { min-width: 0; padding: 16px 10px; overflow-wrap: anywhere; }
      .place-menu span { flex-shrink: 0; }
      .location-films { grid-template-columns: 1fr; }
      .location-film img { height: 240px; }
      .credits { grid-template-columns: 1fr; }
      .credits-image { order: 2; }
      .credits-data { gap: 24px; flex-wrap: wrap; }
      footer { margin: 0 6vw; flex-direction: column; gap: 12px; }
      .lab-viewer-bar { padding: 12px 6vw; gap: 14px; }
      .lab-viewer-title { font-size: 20px; }
      .lab-viewer-bar button { padding: 10px 14px; }
      .lab-viewer-content { padding: 24px 6vw 50px; }
      .cinema-frames figure { margin-bottom: 55px; }
      .cinema-frames.overview { gap: 24px 14px; }
      .cinema-frames.overview img { height: 140px; }
      .cinema-frames figcaption { font-size: 13px; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to photographs</a>
  <header class="masthead">
    <button class="identity" data-view="home" aria-label="Richard photography, home">
      <strong>Richard</strong><span>Photography / Cinema</span>
    </button>
    <nav aria-label="Main navigation">
      <button data-view="home" aria-current="page">Home</button>
      <button data-view="archive">Archive</button>
      <button data-view="places">Places</button>
      <button data-view="about">About</button>
    </nav>
  </header>
  <main id="main" tabindex="-1"><p class="loading" role="status">Preparing the photographs…</p></main>
  <footer>
    <p>Photography by Richard</p>
    <p>A photographic archive. <button data-view="archive">Browse all collections</button></p>
  </footer>
  <script src="/common.js"></script>
  <script>
    window.DesignLab.ready.then(data => {
      const { image, escape: esc } = window.DesignLab;
      const main = document.querySelector('main');
      const archive = [...data.archive].sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
      const years = [...new Set(archive.map(g => g.date.slice(0, 4)))];
      const locations = new Map();
      archive.forEach(gallery => gallery.places.forEach(place => {
        if (!locations.has(place.id)) locations.set(place.id, { ...place, galleries: [] });
        if (!locations.get(place.id).galleries.some(g => g.id === gallery.id)) locations.get(place.id).galleries.push(gallery);
      }));
      const places = [...locations.values()].sort((a, b) => a.title.localeCompare(b.title));
      let selected = 0;
      let year = 'all';
      let placeId = places[0]?.id;
      let activeGallery;
      let galleryMode = 'sequence';
      const photoTotal = new Set(archive.flatMap(g => g.photos.map(p => p.id))).size;
      const placeNames = gallery => gallery.places.map(p => p.title).join(', ');
      const date = value => esc(value);
      const stage = gallery => `
        <div class="screen">${image(gallery.cover, '92vw', true)}</div>
        <div class="screen-caption">
          <div><h1>${esc(gallery.title)}</h1><p class="muted">${date(gallery.date)}${gallery.places.length ? ` / ${esc(placeNames(gallery))}` : ''} / ${gallery.count} photographs</p></div>
          <button class="action" data-gallery="${esc(gallery.id)}">View collection</button>
        </div>`;
      const home = () => `
        <section class="stage" aria-label="Selected collection">
          <div class="stage-intro"><p>Selected photographs</p><p>Choose a collection below</p></div>
          <div id="screen-stage">${stage(data.galleries[selected])}</div>
        </section>
        <section class="program" aria-label="Collection selection">
          <div class="program-heading"><h2>The programme</h2><span>${data.galleries.length} selected collections</span></div>
          <div class="reel">${data.galleries.map((g, i) => `
            <button data-select="${i}" aria-pressed="${selected === i}" aria-label="Select ${esc(g.title)}">
              ${image(g.cover, '(max-width: 560px) 42vw, (max-width: 850px) 28vw, 14vw')}
              <span class="reel-title">${esc(g.title)}</span><span class="reel-date">${date(g.date)}</span>
            </button>`).join('')}</div>
        </section>`;
      const film = gallery => `
        <button class="film" data-gallery="${esc(gallery.id)}" aria-label="View ${esc(gallery.title)}">
          ${image(gallery.cover, '(max-width: 560px) 100px, (max-width: 850px) 150px, 210px')}
          <div><h2>${esc(gallery.title)}</h2><p>${date(gallery.date)} / ${gallery.count} photographs${gallery.places.length ? `<br>${esc(placeNames(gallery))}` : ''}</p></div>
          <div class="film-end">Collection<strong>View photographs</strong></div>
        </button>`;
      const library = () => {
        const filtered = archive.filter(g => year === 'all' || g.date.startsWith(year));
        return `<p class="archive-count" role="status">${filtered.length} collections${year === 'all' ? ' / All years' : ` / ${esc(year)}`}</p><div class="library">${filtered.map(film).join('')}</div>`;
      };
      const archiveView = () => `
        <section class="page">
          <div class="page-head"><div><h1>The film library</h1><p>Every published collection, ordered by the date it was photographed. Start anywhere.</p></div>
            <div class="year-control"><label for="year">Year</label><select id="year"><option value="all">All years</option>${years.map(y => `<option value="${esc(y)}" ${year === y ? 'selected' : ''}>${esc(y)}</option>`).join('')}</select></div>
          </div><div id="archive-results">${library()}</div>
        </section>`;
      const locationFilms = () => {
        const place = locations.get(placeId);
        if (!place) return '<p>No places are listed in these collections.</p>';
        return `<div class="location-heading"><h2>${esc(place.title)}</h2><p>${place.galleries.length} collections photographed here</p></div>
          <div class="location-films">${place.galleries.map(g => `
            <button class="location-film" data-gallery="${esc(g.id)}" aria-label="View ${esc(g.title)}">
              ${image(g.cover, '(max-width: 850px) 80vw, 30vw')}<h3>${esc(g.title)}</h3><p>${date(g.date)} / ${g.count} photographs</p>
            </button>`).join('')}</div>`;
      };
      const placesView = () => `
        <section class="page">
          <div class="page-head"><div><h1>Scenes & places</h1><p>A location index of the archive. Choose a place to see its photographic collections.</p></div></div>
          <div class="locations"><div class="place-menu" aria-label="Choose a place">${places.map(p => `
            <button data-place="${esc(p.id)}" aria-pressed="${p.id === placeId}">${esc(p.title)}<span>${p.galleries.length}</span></button>`).join('')}</div>
            <div id="place-results" aria-live="polite">${locationFilms()}</div>
          </div>
        </section>`;
      const about = () => `
        <section class="page credits">
          <div class="credits-image">${image(data.galleries[0].cover, '(max-width: 560px) 88vw, 42vw')}
            <p class="image-credit">${esc(data.galleries[0].title)} / ${date(data.galleries[0].date)}</p>
          </div>
          <div class="credits-copy"><h1>Photography<br>by Richard</h1>
            <p>A place to spend time with photographs. Browse a collection in sequence, or find your way through the archive by year and place.</p>
            <dl class="credits-data"><div><dt>Published collections</dt><dd>${archive.length}</dd></div><div><dt>Photographs</dt><dd>${photoTotal}</dd></div><div><dt>Places</dt><dd>${places.length}</dd></div></dl>
            <button class="action" data-view="archive">Explore the archive</button>
          </div>
        </section>`;
      const views = { home, archive: archiveView, places: placesView, about };
      function renderView(focus = false) {
        const key = location.hash.slice(1);
        const view = Object.hasOwn(views, key) ? key : 'home';
        main.innerHTML = views[view]();
        document.querySelectorAll('nav [data-view]').forEach(button => {
          if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        document.title = `${view === 'home' ? 'Cinema' : view[0].toUpperCase() + view.slice(1)} — Photography by Richard`;
        if (focus) { main.focus({ preventScroll: true }); window.scrollTo(0, 0); }
      }
      function galleryFrames(gallery, mode) {
        return gallery.photos.map((photo, i) => `<figure id="cinema-frame-${i}" data-photo-id="${esc(photo.id)}">
          <button class="frame-open" data-frame="${i}" ${mode === 'sequence' ? 'disabled' : ''} aria-label="View photograph ${i + 1} in sequence">
            ${image(photo, mode === 'sequence' ? '92vw' : '(max-width: 560px) 42vw, 28vw', i === 0)}
          </button><figcaption><span>${esc(photo.caption)}</span><span>${i + 1} / ${gallery.photos.length}</span></figcaption>
        </figure>`).join('');
      }
      window.DesignLab.renderGallery = gallery => {
        activeGallery = gallery;
        galleryMode = 'sequence';
        return `<div class="cinema-tools"><div><h1>${esc(gallery.title)}</h1><p>${esc(gallery.description)}</p></div>
          <div class="view-modes" aria-label="Photograph layout"><button data-mode="sequence" aria-pressed="true">Sequence</button><button data-mode="overview" aria-pressed="false">Overview</button></div>
          </div><div class="cinema-frames lab-viewer-sequence">${galleryFrames(gallery, galleryMode)}</div>`;
      };
      function setGalleryMode(mode) {
        galleryMode = mode;
        const frames = document.querySelector('.cinema-frames');
        frames.classList.toggle('overview', mode === 'overview');
        frames.innerHTML = galleryFrames(activeGallery, mode);
        document.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      }
      document.addEventListener('click', event => {
        if (event.target.closest('.skip')) {
          event.preventDefault();
          main.focus();
          return;
        }
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.view) {
          if (location.hash === `#${button.dataset.view}`) renderView(true);
          else location.hash = button.dataset.view;
        }
        if (button.dataset.select !== undefined) {
          selected = Number(button.dataset.select);
          document.getElementById('screen-stage').innerHTML = stage(data.galleries[selected]);
          document.querySelectorAll('[data-select]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.select) === selected)));
        }
        if (button.dataset.place) {
          placeId = button.dataset.place;
          document.getElementById('place-results').innerHTML = locationFilms();
          document.querySelectorAll('[data-place]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.place === placeId)));
        }
        if (button.dataset.mode) setGalleryMode(button.dataset.mode);
        if (button.dataset.frame !== undefined) {
          const index = Number(button.dataset.frame);
          setGalleryMode('sequence');
          const frame = document.getElementById(`cinema-frame-${index}`);
          frame.setAttribute('tabindex', '-1');
          frame.focus({ preventScroll: true });
          frame.scrollIntoView({ block: 'start', behavior: 'instant' });
        }
      });
      document.addEventListener('change', event => {
        if (event.target.id !== 'year') return;
        year = event.target.value;
        document.getElementById('archive-results').innerHTML = library();
      });
      window.addEventListener('hashchange', () => renderView(true));
      renderView();
    }).catch(() => {
      document.querySelector('main').innerHTML = '<p class="loading" role="alert">The photographs could not be loaded. Reload this page to try again.</p>';
    });
  </script>
</body>
</html>
