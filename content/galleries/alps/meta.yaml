    caption: "Thun · December 2024"
    rhythm_after: base
    alt_text: "A clear view from a high place in winter. The valley is filled with a thick sea of ​​white clouds, and several snow-covered ridges are exposed above the sea of ​​clouds. On the right side of the frame is a pyramid-shaped snow mountain. On the lower right and right foreground are dark green spruce treetops. On the sea of ​​clouds, there are huge shadows cast by the peaks. The sky is clean blue."
