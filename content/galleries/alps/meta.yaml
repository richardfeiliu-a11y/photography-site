    source_ref: alps/DSC00877.jpg
    caption: "Mont Blanc · August 2024"
    rhythm_after: base
    alt_text: "On the vast glacial snowfield, a row of dark cone-shaped rock peaks stand like sawtooths, with some rock walls covered with snow and ice. There is another snow-capped mountain in the distance on the left. There are strong sun spots and thin clouds at the top of the frame, and the long shadows of the rock peaks are trailed on the snow."
  - id: p_alps_four_seasons_006
