    alt_text: "Clouds and mist rise from the valley, and in the distance are the peaks and blue sky covered with thick snow and glaciers. The lower left and right sides of the frame are dark and sharp rock ridges; the upper right corner of the viewing platform built on the rock wall is exposed, with several people standing on the platform."
