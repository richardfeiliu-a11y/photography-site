    caption: "Mont Blanc · August 2024"
    rhythm_after: base
    alt_text: "Under the dark blue sky, a snowfield full of folds and ravines extends from the bottom of the frame. In the center of the snowfield is a man wearing a red coat and carrying a backpack, walking alone on the snow; above the snowfield is a ridge of dark gray giant rocks, and several cables slant across the sky on the upper right."
  - id: p_alps_four_seasons_005
