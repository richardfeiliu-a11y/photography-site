    source_ref: alps/DSC00893.jpg
    caption: "Mont Blanc · August 2024"
    rhythm_after: base
    alt_text: "Against the foggy gray background, a huge granite pillar stands. The rock surface is yellow-brown and off-white. Two climbers wearing colorful clothes are climbing up on the lower right side of the rock pillar. Several tourists are standing on the metal viewing platform on the lower left side. Below the platform is the top of a cylindrical building."
  - id: p_alps_four_seasons_007
