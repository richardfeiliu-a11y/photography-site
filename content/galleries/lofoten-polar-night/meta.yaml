    rhythm_after: base
    alt_text: "The night scene of the city in the blues moment: a long bridge arcs across the frame, with a row of street lights on the bridge, and the traffic leaves long white and red light trails on the bridge deck; under the bridge is a snow-covered road and a traffic light intersection, with several cars passing by dragging their lights; in the background is a snow-covered urban hillside, with densely packed houses and yellow light spots covering the hills, and the sky is filled with blue-gray clouds."
  - id: p_lofoten_polar_night_006
