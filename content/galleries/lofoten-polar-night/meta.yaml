  - id: p_lofoten_polar_night_004
    source_ref: lofoten-polar-night/DSC02278.jpg
    caption: "Lofoten · January 2025"
    rhythm_after: base
    alt_text: "A triangular modern church in the Blues Moment. The white shell is in the shape of a sharp triangle. The front is almost entirely glass curtain wall. Bright warm yellow light shines through the interior, and the cross structure inside the glass can be seen. Crowds gather on the snow in front of the church. In the foreground are snow-covered roads and guardrails with traces of melted snow. There are vehicles passing by on the road, and the sky is dark blue."
  - id: p_lofoten_polar_night_005
