    alt_text: "A city street scene in a snowfall on a winter night, with snow on the road and dense snowflakes floating in the air; a warm yellow light shines through the glass window of a dark-walled building on the right, with large white letters on the window; several pedestrians wearing dark winter clothes and carrying backpacks are walking forward with their backs to the camera; there is a row of cars parked on the left, their lights shining in the snow and fog, and the overall tone is cold blue-grey."
