    rhythm_after: base
    alt_text: "A roadside at dusk in winter: the sun is setting behind the snow-covered mountains, with an orange-yellow glow on the horizon, and a narrow band of illuminated clouds across the sky; in the foreground is an icy and slippery road, with speed limit signs and diamond-shaped warning signs standing on the roadside; on the left edge is a car parked with its door open, and a man in dark clothes standing next to the car with his back to the camera, and on the right are snow-covered fields and wooden fences."
