    caption: "Lofoten · January 2025"
    rhythm_after: base
    alt_text: "A distant view of a fjord town under winter twilight: on the left is a snow-covered mountain with dark tree lines on the mountain. At the foot of the mountain are snow-covered houses lined up along the water's edge, with sporadic warm lights on the roofs; on the right is the open dark blue-gray sea, with a white and red boat sailing into the distance; on the horizon in the distance are the silhouettes of continuous snow-capped mountains, and the sky is grey-blue."
  - id: p_lofoten_polar_night_003
