    rhythm_after: base
    alt_text: "Coastline at dusk: On the right is a row of jagged steep peaks. The snow on the ridges and rock walls is illuminated golden orange by the low-angle sunset; the sea surface is calm and dark blue, with an orange-pink haze belt on the skyline; the rocks near the coast are covered with thin snow. At the bottom of the frame is a curved wooden plank road with several tourists walking on the shore and waterside."
