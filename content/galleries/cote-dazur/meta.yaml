    caption: "Nice · July 2024"
    rhythm_after: base
    alt_text: "In the center of the frame is a giant dark blue sculpture. It is shaped like a slatted chair with the legs turned up and the seat facing the side. It is installed on a square concrete base. There is an explanation board on the front of the base. The sculpture overlaps with the city coastline, sea and beach in the distance. On the lower right are pedestrians on the seaside promenade."
