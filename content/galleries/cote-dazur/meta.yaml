    caption: "Nice · July 2024"
    rhythm_after: base
    alt_text: "A high-angle overhead shot of a rocky bay: on the left side of the frame is a large flat reef that has been tanned to a light yellow color. A man wearing only swimming trunks is standing on the edge of the rock, facing the water on the right side of the frame; on the right side of the reef is clear turquoise water, and underwater rocks can be seen from the surface of the water. There is a freshly splashed white water in the water; there is another swimmer in the lower right corner of the frame."
  - id: p_cote_dazur_019
    place: pl_nice   # owner-approved 2026-09-15 (local review)
