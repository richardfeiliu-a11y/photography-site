    captured_at: "2025-03-02T16:42:34"
    caption: "Wuppertal · March 2025"
    rhythm_after: base
    alt_text: "Sunny winter city street scene: A green steel structure truss bridge spans the center of the frame, with a reddish-brown bridge deck underneath; behind the bridge is a light gray multi-story building with rows of sunshades hanging under the windows; at the rear right is a green arched steel bridge and pedestrian walkway. Two pedestrians walked under the bridge. There are many traffic signs and a blue and white striped warning pole on the roadside, and the sky is blue."
  - id: p_winter_europe_008
    source_ref: winter-europe/DSC02944.jpg
