    caption: "Nuremberg · March 2025"
    rhythm_after: base
    alt_text: "A historical court or meeting hall: on the left and directly in front is a dark brown wooden wainscot; a dark wooden cross hangs in the center of the high wall, and two crystal chandeliers hang from the ceiling; in front of the wall is a row of dark seats and a long wooden railing; on the right, a large window with a square window is hung with long dark green curtains, and the sunlight casts square spots of light on the ground."
  - id: p_winter_europe_013
    source_ref: winter-europe/DSC03096.jpg
    place: pl_rhine_valley
    captured_at: "2025-04-05T12:38:43"
    caption: "Rhine Valley · April 2025"
    rhythm_after: base
    alt_text: "A magnificent stone monument under the clear blue sky: the monument is a semicircular stone building, with a heavy base with arched niches on the lower floor, and a column structure with square openings on the upper floor; a statue of an equestrian figure stands on the top of the monument; there is a large tree with almost bare branches on each side of the monument, and a new green grassland is on the lower left, and the sky is pure dark blue."
  - id: p_winter_europe_014
    source_ref: winter-europe/DSC03104.jpg
    place: pl_rhine_valley
    captured_at: "2025-04-05T14:17:18"
    caption: "Rhine Valley · April 2025"
    rhythm_after: base
    alt_text: "A panoramic view of the valley peninsula seen from a height: a wide river bends into a huge horseshoe shape in the frame, with a flat peninsula surrounded by the river in the center; on the peninsula are large ridges, vegetable fields, and groves of woods, with a village clustered in the middle, and a church among the densely packed houses with dark pitched roofs; on the other side of the river and in the distance are rolling low hills, and a barge is sailing on the river."
  - id: p_winter_europe_015
    source_ref: winter-europe/DSC03106.jpg
    caption: "Rhine Valley · April 2025"
    rhythm_after: base
    alt_text: "A high-angle view of a river valley town: a wide river bends in the middle of the frame, the water surface is grey-blue, and a long barge is sailing in the middle of the river; there are dense town buildings on both sides, mostly multi-story houses with white walls and dark sloped roofs. There is a road and a row of street trees along the river; there is a church with a steeple near the left bank; the background is continuous low hills covered by forests."
