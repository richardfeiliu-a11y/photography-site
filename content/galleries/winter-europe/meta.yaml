    captured_at: "2025-03-02T17:55:38"
    caption: "Wuppertal · March 2025"
    rhythm_after: base
    alt_text: "Under a green steel-framed elevated track bridge: the huge steel frame structure is gathered from the top and sides of the frame to the middle, forming a row of heavy suspended tracks, with a square rail car cabin hanging below the track; under the bridge is a shallow river, with stones and shoals scattered on the riverbed; on both sides are stone retaining walls, bare trees and red brick and white factory-style buildings, with the sun shining slantingly on the steel frame."
  - id: p_winter_europe_009
