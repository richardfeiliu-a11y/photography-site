    rhythm_after: base
    alt_text: "A train in the exhibition hall of the Railway Museum: the streamlined front of a modern high-speed train, with a white body and a bright red horizontal strip. The cab has a dark windshield and glass side windows. There is a red sign and two bright lights on the front. The train is parked on a gravel-paved display track. On the left is a long dark reflective ground passage. Other carriages on display can be seen in the distance."
  - id: p_winter_europe_011
