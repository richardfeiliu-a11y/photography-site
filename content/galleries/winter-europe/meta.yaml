    source_ref: winter-europe/DSC01927.jpg
    caption: "Düsseldorf · November 2024"
    rhythm_after: base
    alt_text: "Streetside in a residential area in autumn: In the center of the frame is a tree with its crown almost gone but with golden leaves still on its branches; on both sides of the tree are several modern multi-story residential buildings, one with a curved facade and a glass balcony on the left; the ground is covered with yellow leaves, a silver-gray and a black car are parked on the roadside, there are several dark trash cans beside the roadside, and the sky is light blue with white clouds."
  - id: p_winter_europe_002
    source_ref: winter-europe/DSC01936.jpg
    place: pl_dusseldorf
    captured_at: "2024-12-01T02:54:37"
    caption: "Düsseldorf · December 2024"
    rhythm_after: base
    alt_text: "Christmas market at night: In the center of the frame is a tall carousel-style lighting installation with a red pinwheel-shaped wheel on the top. The lower part is divided into two floors. Each floor is surrounded by green garlands, gold and red lights and puppets. The installation is illuminated with warm lights. Below the installation are market stalls, crowded with tourists wearing winter clothes. The background is dark city buildings, and a shop sign on the lower right is lit with yellow light."
  - id: p_winter_europe_003
    source_ref: winter-europe/DSC01943.jpg
    caption: "Düsseldorf · December 2024"
    rhythm_after: base
    alt_text: "A stall at the Christmas market: The wooden stall is filled with dozens of glowing star-shaped paper lanterns in red, white, yellow, green, and gold colors. There are many lighted small house models and Christmas tree-shaped ornaments on the stall. Inside the stall, a bearded man and a long-haired woman are lowering their heads to sort out the goods. Two customers are standing on the right side of the stall looking in."
  - id: p_winter_europe_004
    source_ref: winter-europe/DSC01958.jpg
    place: pl_dusseldorf
    captured_at: "2024-12-01T03:26:41"
    caption: "Düsseldorf · December 2024"
    rhythm_after: base
    alt_text: "A corner of the night playground: The upper part of the frame is occupied by a huge Ferris wheel. The wheel body is composed of a white steel structure, the skeleton is illuminated by blue and white lights, and multiple square cabins are hung; on the left side of the Ferris wheel is an old-fashioned building with an octagonal tower and a red tile roof; in the foreground are several Christmas market stalls and a few bare trees trimmed into spherical branches, and the sky is dark blue."
  - id: p_winter_europe_005
    source_ref: winter-europe/DSC02005.jpg
    caption: "Ruhr · December 2024"
    rhythm_after: base
    alt_text: "The passage between the modern buildings on a sunny day: on both sides are two huge deep brick buildings, with rows of slender glass window strips arranged horizontally on the facades; in the middle is a straight passage paved with dark stone slabs and grass strips leading to a horizontal building in the distance, with bright green lawns on both sides of the passage; at the end of the passage there are several pedestrians walking with their backs to the camera, and the sky is light blue with an airplane cloud."
  - id: p_winter_europe_006
    source_ref: winter-europe/DSC02160.jpg
    caption: "Brussels & Amsterdam & London · January 2025"
    rhythm_after: base
    alt_text: "The indoor atrium of a large train station: above is a ceiling covered with strips of grilles and light strips; a square display frame hangs above the center, showing an image of a circular clock that an athlete is climbing; below is a long dark red festive decorative board with white gift patterns and holiday messages; on the left is a glass escalator with many passengers carrying luggage passing by."
