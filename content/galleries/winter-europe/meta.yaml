    caption: "Nuremberg · March 2025"
    rhythm_after: base
    alt_text: "The indoor exhibition hall of the Railway Museum: The main body of the frame is an old-fashioned locomotive. The front of the locomotive is black and covered with rivets. The lower skirt is bright red. There are two circular buffers and lights in front of the locomotive. Red wheels and connecting rod structures can be seen on the side of the locomotive. A black information board stands next to the locomotive. On the left is a long exhibition hall passage, with the backs of two visitors in the distance."
  - id: p_winter_europe_010
