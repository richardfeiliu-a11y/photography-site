    alt_text: "A group of stone pillar-like peaks under a clear blue sky: Three towering, almost vertical stone pillar-like mountains stand on the right side of the center of the frame. The rock walls are grey-brown and the surface is covered with longitudinal textures. Green trees grow between the tops and gaps of the stone pillars. They are surrounded by dark green forest slopes. The sky is blue, with large white fluffy cumulus clouds floating in the air."
  - id: p_south_china_summer_009
    source_ref: south-china-summer/DSC03518.jpg
