    caption: "Nanjing · August 2025"
    rhythm_after: base
    alt_text: "Inside a dense summer broad-leaved forest: numerous straight and slender dark tree trunks extend from the bottom of the frame to the top. The branches and leaves form a dense green crown above the head. Sunlight penetrates through the gaps in the tree crown and shines on the tree trunks and forest floor. There is a dark green broad-leaved shrub in the foreground at the bottom of the frame. The understory is relatively dark, and no direct light from the sky can be seen."
  - id: p_south_china_summer_004
