    alt_text: "A panoramic view of the mountainous area from the top of the mountain: the frame is dotted with pinnacles covered by dark green vegetation, and a winding mountain road winds down the mountain with dense switchbacks; rows of cable car cableways and a group of buildings in the valley can be seen in the remote position on the lower left, and in the distance are cities and foggy outlines on the plain; the tops of several peaks in the close view are exposed rock pillars."
  - id: p_south_china_summer_007
