    alt_text: "The atrium of an indoor commercial street: hundreds of painted paper umbrellas in red, pink, blue, white and other colors are hung in the space, densely covering the top of the entire frame; the background is an antique Chinese-style building, with gray tile sloping roofs, dark wooden grille doors and windows, second-story wooden railings and several red lanterns; there is a dark plaque with golden Chinese characters in the middle of the lower part of the frame, and underneath it is a circular light-emitting device."
  - id: p_south_china_summer_012
