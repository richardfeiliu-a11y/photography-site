    alt_text: "A panoramic view of a port city viewed from a high place under a cloudy sky: in the middle of the frame is a wide harbor with several ships on the sea; near the shore is a large area of ​​extremely dense high-rise buildings, with a high-rise building with an obvious cross-steel frame pattern in the middle of the glass curtain wall building group; on the other side there are also high-rise buildings and neat buildings, behind it is a continuous green mountain range, and the sky is thick with clouds."
  - id: p_south_china_summer_013
    source_ref: south-china-summer/DSC03688.jpg
