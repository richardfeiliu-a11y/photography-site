    alt_text: "A city street under the green shade of summer: there are rows of tall plane trees on both sides, and the dense branches and leaves gather together to form a green tunnel above the street; the road is an asphalt road with a solid yellow line and a white dotted line in the middle. There are several people riding electric scooters and bicycles on the road, and one person is riding a blue bicycle in the front right; there are also pedestrians on the sidewalk on the left, and the light shines through the leaves and casts mottled light and shadow."
