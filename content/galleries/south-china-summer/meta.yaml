    alt_text: "A natural mountain cave landscape: there is a large oval hole in the center of the huge mountain, with a bright white sky revealing the entrance, surrounded by dense white clouds; there is a steep and extremely long stone staircase from the foot of the mountain leading directly to the entrance of the cave, and the steps are densely packed with tourists climbing up; both sides of the mountain are covered with dense green vegetation, and a thin white waterfall flows down the left side."
