    alt_text: "A large light gray stone monumental building is located in front of a green forest: the monument is rectangular, with a crest on the top and rows of carved decorations, and several vertical grooves on the surface; there are many white birds on the top and sides of the monument; there are dozens of tourists in summer clothes gathered on the platform in front of the monument, and some are taking a group photo; below the frame are neatly trimmed hedges and stone walls."
  - id: p_south_china_summer_005
