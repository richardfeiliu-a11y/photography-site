    alt_text: "Looking up at a multi-story Chinese-style wooden pavilion: the pavilion is mainly bright red, with multiple overlapping eaves that retract upwards, and the ends of the eaves are raised. There are red railings and columns on each floor, and the bracket structure can be seen under the eaves; a dark blue background with gold letters hangs on the front of the pavilion; there is a gray-white stone guardrail on the left side of the foreground, and leaves extend into the upper right corner of the frame; the sky is blue, with large white clouds floating."
