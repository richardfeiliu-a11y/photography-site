    rhythm_after: base
    alt_text: "Panoramic view of the peak forest from a high place: countless densely packed quartz sandstone pillars rise from the deep valley. The pillars are grey-brown, with vertical grooves and weathering marks on the surface. Green trees grow in the gaps between the pillar tops and the pillar bodies. The mountains in the distance extend to the horizon in layers. The tops of the mountains are flat and the slopes are covered with forests. There are thick clouds in the sky, revealing a few patches of blue sky. The foreground at the bottom of the frame is a dark green tree crown."
  - id: p_south_china_summer_010
    source_ref: south-china-summer/DSC03546.jpg
