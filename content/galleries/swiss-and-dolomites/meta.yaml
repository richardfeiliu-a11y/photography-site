    alt_text: "A park-like lakeside green space, with lawns and an oval light blue pool in the foreground, a thin water column sprays out from the center of the pool, and a dark portrait sculpture stands on two stone piers beside the pool; people are resting on benches under several tall broad-leaved trees, and there are several figures deep in the middle path; in the background are dark mountains shrouded in mist, and the sky is filled with white clouds."
