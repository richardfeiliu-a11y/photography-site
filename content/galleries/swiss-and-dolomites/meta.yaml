    alt_text: "It is an alpine lake on a clear summer day. The lake water is a rich turquoise color that runs across the middle and lower part of the frame. There are several tall broad-leaved trees growing on the grassland on the lakeshore, one of which has drooping branches and leaves. There are sunshades and a few small figures on the grass under the trees. On the other side is a hillside covered with dense forests and bright meadows, dotted with several small houses with dark roofs. The top of the frame is a green ridge."
