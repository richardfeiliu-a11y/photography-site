    alt_text: "In a lakeside town under a cloudy sky, multi-story houses with yellow, orange, red and pink exteriors are densely stacked on a steep hillside, with green shutters on the windows; there are several small sailboats parked on the lake, and there are stone walls and arched waterways on the shore; in the lower right of the foreground are red railings and a long row of yellow-purple flowers in full bloom, and in the distance are mountain forests in the mist."
  - id: p_lakes_and_meadows_014
    source_ref: swiss-and-dolomites/DSC03310.jpg
    caption: "Thun · June 2025"
    rhythm_after: base
    alt_text: "A lake scene in rainy weather. The lake is wide and dark green. On the other side is a small town composed of green grass slopes and rows of dark-sloped houses. There are scattered boats parked on the shore. The hillside in the background is completely covered by dark green forests. The top of the mountain is covered by low-hanging white clouds, and the clouds are thick."
  - id: p_lakes_and_meadows_015
