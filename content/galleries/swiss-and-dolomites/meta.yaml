    rhythm_after: base
    alt_text: "Looking through a heart-shaped hollow dug out of a wooden board, the middle scene shows a pair of men and women sitting on a wooden bench. One is wearing a black coat and a black hat, and the other is wearing an orange-red top. In the farthest distance is a huge light gray rock mountain peak; on the hillside are green and yellow meadows and sparse coniferous trees. Icons and lettering are faintly visible on the lower edge of the board."
  - id: p_lakes_and_meadows_009
