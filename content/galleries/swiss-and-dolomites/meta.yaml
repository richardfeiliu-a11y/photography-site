    caption: "Thun · December 2024"
    rhythm_after: base
    alt_text: "The ground is paved with slates after snow. A large pile of snow has been swept away and piled on a stone pier on the left. A gray-and-white cat is sitting sideways on the stone tiles next to the snowdrift, with its back to the camera. At the top of the frame, a black car is parked on the road. The rear wheels of the car are half buried behind a wall of snow. The headlights and silver wheels are visible."
  - id: p_lakes_and_meadows_002
    source_ref: swiss-and-dolomites/DSC02066.jpg
    caption: "Thun · December 2024"
    rhythm_after: base
    alt_text: "On the lakeside in a foggy day after snow, the lake surface is calm and gray-blue. On the hillside on the other side are village houses covered with snow. In the center of the frame, a tall deciduous tree is bare and leafless. On the right, two people wearing dark winter clothes stand on the snow on the lakeshore and look into the distance. The person on the right is walking to the right with his back to the camera. The sky is gray and white."
  - id: p_lakes_and_meadows_003
    source_ref: swiss-and-dolomites/DSC02070.jpg
    caption: "Thun · December 2024"
    rhythm_after: base
    alt_text: "On a train platform in the snow, a red and white train is heading towards the platform along the rails. The track and platform are covered with snow; above are dense catenary brackets and wires, and on the platform are two red triangle warning signs and platform number plates; on the left platform is a backpacker standing with his back to the camera, and on the right are several cars and a steeple house."
  - id: p_lakes_and_meadows_004
    place: pl_interlaken   # owner-approved 2026-09-15 (local review)
    source_ref: swiss-and-dolomites/DSC02078.jpg
    caption: "Thun · December 2024"
    rhythm_after: base
    alt_text: "The lake is like a mirror, and the hillside on the other side is densely dotted with village houses with pitched roofs. The roofs are intertwined with fresh snow, and the woods and sky on the upper part of the hillside are shrouded in mist. The villages and woods are reflected in the dark blue lake below, almost completely symmetrical, and a small tower-like building stands on the top of the mountain."
  - id: p_lakes_and_meadows_005
    source_ref: swiss-and-dolomites/DSC02085.jpg
    caption: "Thun · December 2024"
    rhythm_after: base
    alt_text: "Winter scenery of the lakeside in the fog. A row of trees (a mixture of evergreen conifers and bare deciduous trees) stand on the snow-covered shoreline. The background is the hillside covered with thin snow and the forest in the fog. The lake water in the vicinity is calm and reflects the shadows of the trees. There are two white buoys floating on the water in the lower right corner. A small boat covered with a white tarpaulin is parked on the right shore."
  - id: p_lakes_and_meadows_006
    source_ref: swiss-and-dolomites/DSC03125.jpg
    place: pl_dolomites
    captured_at: "2025-05-01T20:09:46"
    caption: "Dolomites · May 2025"
    rhythm_after: base
    alt_text: "At dusk, a row of jagged rock peaks were dyed orange-red by the setting sun. There was still snow on the peaks, and the slopes below the peaks were covered with dark green coniferous forests. There was a village in the foreground, with two-story houses with white walls and deep roofs arranged at random. There were hedges and shrubs with yellow flowers in front of the houses. There was a street sign with the name of the street at the intersection, and a car on the right was covered by a green tarpaulin."
  - id: p_lakes_and_meadows_007
    source_ref: swiss-and-dolomites/DSC03172.jpg
    caption: "Dolomites · May 2025"
    rhythm_after: base
    alt_text: "A wooden structure alpine inn under a clear sky. The two-story wooden building is lined up along the hillside, with verandahs and railings. The exterior walls are made of dark logs. In front of the building is a large green grassy slope full of yellow wildflowers. On the right side is the coniferous forest on the hillside. The sky is dark blue with white clouds."
  - id: p_lakes_and_meadows_008
    source_ref: swiss-and-dolomites/DSC03188.jpg
    place: pl_dolomites
    captured_at: "2025-05-02T12:17:57"
