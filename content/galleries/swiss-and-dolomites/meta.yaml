  - id: p_lakes_and_meadows_011
    source_ref: swiss-and-dolomites/DSC03218.jpg
    caption: "Dolomites · May 2025"
    rhythm_after: base
    alt_text: "In the alpine meadow under the sun, a large bright green grass slope slopes from the lower left to the upper right of the frame, with several trails carved on the slope; a small group of white and black-and-white cattle are grazing on the left side of the grass slope, and a few people are walking along a horizontal path on the right side; in the background are dark green coniferous forests and shadowed hillsides."
  - id: p_lakes_and_meadows_012
    source_ref: swiss-and-dolomites/DSC03222.jpg
    place: pl_dolomites
    captured_at: "2025-05-02T19:42:41"
    caption: "Dolomites · May 2025"
    rhythm_after: base
    alt_text: "In the evening or early morning light, a large row of tooth-shaped gray-white rock peaks spans the upper part of the frame, with patches of snow hanging on the rock walls; in front of the peaks are rolling hillsides covered with dark green coniferous forests, and in the lower part of the frame is a bright alpine meadow. The meadow is dotted with cottages with white walls and deep roofs, and there is a church with a steeple in the center."
