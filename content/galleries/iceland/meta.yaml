    alt_text: "A wide waterfall pours down from the moss-covered black rock wall. The water divides into multiple streams and falls into the blue pool below. Water mist rises on the surface of the pool. On both sides of the waterfall are towering rock walls and steep slopes covered with green moss. There is also a small waterfall on the right rock wall, and a corner of blue sky and white clouds are exposed at the top of the frame."
