    alt_text: "The white church on the seaside, with its red roof and red spire, is very eye-catching. The church is built next to an asphalt parking lot. In the foreground of the frame is a large grassland full of purple lupine flowers. Tourists and several cars are scattered in the parking lot and grassland. On the left side of the background are green steep cliffs and a black beach. There are several black reef pillars standing on the sea, and the sky is blue with large white clouds."
