    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "A European city canal on a cloudy day: the top of the frame is framed by dense green leaves, and on the right is a tree with a thick trunk and hanging willow branches; in the middle is the green river covered with duckweed and grass on both sides, and at the end stands a brick building with a spire and dormer windows; in the foreground is a long row of pink and purple hydrangeas in bloom, and there is a cyclist on the road to the left."
  - id: p_netherlands_009
