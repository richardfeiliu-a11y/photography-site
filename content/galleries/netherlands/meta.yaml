    alt_text: "Looking up from a low angle at a large painting hanging in a tall glass curtain wall: in the center of the painting is a long vertical yellow-toned painting of a sunflower in bloom, with flowers and leaves expressed with thick brushstrokes; behind the painting is a curved glass curtain wall, through which the gray sky and metal frames can be seen, and several spotlights are mounted above the painting."
  - id: p_netherlands_014
