    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "The appearance of a modern art museum under a cloudy sky: the main body is a curved building with a translucent light-colored stone exterior wall and a dark oval eaves on the top. A signboard with the name of the museum in white letters on a black background is hung on the curved wall; on the right side of the building is a connected glass curtain wall part, and the internal stairs can be seen; on the left background are red old-fashioned spire houses and rows of green trees, and the sky is covered with dark clouds."
  - id: p_netherlands_010
    source_ref: netherlands/DSC00056.jpg
    place: pl_amsterdam
    captured_at: "2024-07-13T09:17:11"
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "The square and classical buildings on a cloudy day: in the central background is a majestic brick-red classical theater, with a pediment and rows of sculptural reliefs on the front, golden decorations on the edge of the roof, and large colorful performance posters hanging on the walls; in front of the building are broad lawns and trees, with a blue-and-white painted tram on the left; a paved brick walkway extends toward the building in the lower left corner."
  - id: p_netherlands_011
    source_ref: netherlands/DSC00068.jpg
    place: pl_amsterdam
    captured_at: "2024-07-13T11:03:24"
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "There is a high-open exhibition hall in the art museum: a huge classic group portrait oil painting hangs on the wall in front, with many characters and a dark and golden tone. The painting is mounted behind a glass partition wall. Through the glass, you can see the reflection of the bracket in front of the painting and the audience; there is a banner above the wall with the name of the artist; in the foreground is a group of spectators with their backs to the camera, one of whom is holding up a mobile phone to take pictures."
  - id: p_netherlands_012
    source_ref: netherlands/DSC00098.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "There is a gold-framed oil painting hanging on the exhibition wall of the museum: the painting depicts a large field of colorful tulips in bloom, red, yellow, and white. There are several dark windmills in the field, with the horizon and gray-white cloudy sky in the distance. The frame is a thick golden carved wooden frame, and there is a light-colored explanatory board on the right wall with information about the painting and the author. The wall is pure beige."
