    caption: "Den Haag · July 2024"
    rhythm_after: base
    alt_text: "The scene in front of the city square: a huge white square column on the left with a gold city emblem and words inlaid on the column; in the central background is a blue multi-story square building with a hotel sign on the roof. In front of the building there is a construction fence covered with colorful graffiti and a row of bicycles; in the foreground is a construction barbed wire fence with two yellow signboards."
  - id: p_netherlands_002
    source_ref: netherlands/DSC00035.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "A blue flag is flying on a flagpole under a cloudy sky. The words are written in large white characters on the flag, and there are smaller characters and a spiral logo below. Behind the flag are green trees with dense branches. Through the gaps between the trees, you can see an old brick building with a dark roof and a bell tower. There is also a metal pole and a black pole extending diagonally in the frame, and the sky is gray and white clouds."
  - id: p_netherlands_003
    source_ref: netherlands/DSC00039.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "In the evening urban street scene, a modern tram painted in red and white is driving out of the street, with the route number on the front display and the lights on; the tram passes through the lower passage of a dark brick apartment building, and there is a warm-colored mural on the inner wall of the passage; in the foreground is a slippery street paved with bricks and embedded with tram tracks, with a black and white striped signal pole standing on the left, and the overall light is blue at the moment."
  - id: p_netherlands_004
    source_ref: netherlands/DSC00044.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "Platform level inside the train station: In the mid-ground, an intercity train painted in blue and white is parked on the platform, with warm light shining through the windows, and a yellow train can be seen behind; a man wearing a red hooded jacket stands on the platform with his back to the camera; in the foreground is a row of silver automatic ticket gates with yellow panels, some of which display red crosses; a blue passenger information display hangs above."
  - id: p_netherlands_005
    source_ref: netherlands/DSC00045.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "In the evening, you can see through a huge curved glass curtain wall: inside the curtain wall is the interior of a bright public building, with a large number of point lights on the ceiling. There are figures and an escalator in the room; in the front of the frame is the edge of a light gray concrete arched building, with a pine tree on the right; in the background stands a reddish-brown multi-story tower with lights on in the windows and a dark blue twilight sky."
  - id: p_netherlands_006
    source_ref: netherlands/DSC00047.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "City business district in the evening: On the left is a huge light gray glass-walled office building with densely packed floors and some windows are lit; in the background on the right are several modern high-rise buildings, one with a blue sign on top and another with rows of warm lights on its facade; in the center is a sunken highway with vehicles driving on it, with concrete walls on both sides and blue railings on the right."
  - id: p_netherlands_007
    source_ref: netherlands/DSC00048.jpg
    caption: "Amsterdam · July 2024"
    rhythm_after: base
    alt_text: "An urban pedestrian passage at dusk: The frame is covered by a set of huge metal structures, with thick tilted pillars on both sides. The staggered triangular slats between the pillars extend downward to form a tunnel-like visual channel, with warm yellow light shining from the depths. The ground is paved with stone tiles, which are illuminated by warm stripes by the light above. On both sides are dark blue glass curtain wall buildings and street trees."
  - id: p_netherlands_008
    source_ref: netherlands/DSC00050.jpg
