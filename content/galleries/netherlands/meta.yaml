    alt_text: "A macro close-up of a plant: in the center of the frame is a wild plant with an umbel-like inflorescence. There are clusters of small white flowers on multiple thin stems. The flowers are composed of many tiny petals. There is a small insect sitting on the top cluster of flowers. The background is blurred green grass and wide leaves, and there are several unopened flower buds and buds at the bottom of the frame."
