    alt_text: "The water and the city pier in the evening: On the left side of the center of the frame, there is a bright pink round-headed small cruise ship parked on the water, with decorative paintings on the side; on the right is the pier area, with a high-rise modern board-type hotel building, in front of the building are low glass buildings and dark buildings with words; in the distance on the left are low shorelines and cranes, on the left side of the sky are thick dark gray rain clouds, and on the right side is the blue sky."
