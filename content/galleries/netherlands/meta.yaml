    alt_text: "Street scene of a wooden house village during the day: On the left is a long row of traditional houses with dark green wooden walls and dark tile roofs. There is a wooden staircase in front of the house; in front of the house is a neat garden with patches of blooming pink, red, and white flowers and pruned shrubs; there are several groups of tourists walking along a paved path. A group of three people in the foreground have their backs to the camera, and there is a large tree with lush branches on the right."
  - id: p_netherlands_019
