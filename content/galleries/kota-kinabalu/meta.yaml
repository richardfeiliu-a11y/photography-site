    source_ref: kota-kinabalu/FEI03711.jpg
    caption: "Kota Kinabalu · March 2026"
    rhythm_after: base
    alt_text: "There is a huge inflatable yellow rubber duck propped on the beach, with an orange-red beak and soles, 'hands' on both sides of the body raised, and a white chest. Behind and on both sides of the duck are green sea pine trees with drooping leaves. There are parasols, deck chairs, and folding tables and chairs under the trees. You can see the turquoise sea through the tree trunks in the distance, and the beach is white."
