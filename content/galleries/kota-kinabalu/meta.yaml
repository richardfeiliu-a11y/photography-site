    alt_text: "Sunset at the seaside: a bright sun is close to the horizon, dyeing the entire sky and sea into orange-gold, and the sunlight draws a golden reflective strip on the water; the silhouettes of more than a dozen vacationers are scattered on the beach, some standing, some in pairs, and some taking photos; there are silhouettes of pine tree branches extending into the upper and upper right corners of the frame, and the lower half is a dark beach."
