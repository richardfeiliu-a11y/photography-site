    caption: "Kota Kinabalu · March 2026"
    rhythm_after: base
    alt_text: "A stretch of white sandy beach extends along a shallow arc-shaped bay. The offshore water is clear turquoise, gradually turning into dark blue outwards; several weathered driftwood logs lie scattered on the sand, and the shore is otherwise empty; the sky is clean blue, and the faint outline of the island vaguely appears on the horizon."
  - id: p_kota_kinabalu_003
