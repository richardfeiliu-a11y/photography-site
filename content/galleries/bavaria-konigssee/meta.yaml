    alt_text: "On an emerald green alpine lake on a sunny day, a wooden-hulled cruise ship carries tourists on the lake. The boat has a white hull, a wooden sunshade on the top, and a small flag at the stern. The lake is crystal clear, and you can see the light-colored lake bed underwater. On the right side of the foreground are a row of wooden piles inserted into the water and a wooden trestle, and in the background are steep rock walls covered with coniferous forests."
