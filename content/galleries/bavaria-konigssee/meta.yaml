    alt_text: "A broad panoramic view of an alpine lake: the dark blue surface of the lake runs across the lower part of the frame. On the left side of the lake shore is a steep, almost vertical light gray rock wall, and on the right side of the mountain there is a slender waterfall pouring down from a high place; the hillside is covered with dark green coniferous forest and grassland, and there is a small wooden house on the lakeside grassland; the top of the mountain is covered by white clouds, and the sky is filled with cumulus clouds."
