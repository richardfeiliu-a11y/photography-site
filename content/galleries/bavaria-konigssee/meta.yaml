    alt_text: "There is a small church by the lake with white walls and a dark red onion-shaped dome, surrounded by green trees. On the left side of the church is a rectangular building with a dark pitched roof and a wooden corridor. Many tourists gather on the shore. The lake is blue and rippled. In the background are two towering rock peaks, with white snow remaining on the mountains and clouds and mist in the valleys."
