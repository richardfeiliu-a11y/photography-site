    alt_text: "A clear stream winds from the front of the frame to a lake in the distance. The water stirs up white splashes among the rocks. The stream is lined with green grass-covered riverbanks and scattered stones. There is a tree with a slender trunk and leaves illuminated by the sun in the front left. There are several wooden houses in the distance on the left bank. At the end of the stream is a steep rock-walled valley covered with coniferous forests. Leaves hang down from the top of the frame."
