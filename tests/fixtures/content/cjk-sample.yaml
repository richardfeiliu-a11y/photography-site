# WP-05 Option B demonstration fixture — mixed Latin/CJK authored strings.
#
# Test-only data exercising scripts/fonts/subset-poc.mjs (build-derived subset
# scan). NOT production content; makes no claim about the WP-09/WP-12 schema.
#
# Deliberate composition:
#   - Ordinary GB2312-level hanzi (in the Option A broad static subset).
#   - 堃 昇 邨 濬 — GBK-only glyphs OUTSIDE GB2312, hence outside the Option A
#     subset: Option B picks them up from authored content; Option A relies on
#     the system CJK fallback for them (PERFORMANCE_BUDGET §7.4 trade-off).
#   - The outside-subset probe char 喆 (tests/e2e/fonts.spec.ts) is
#     deliberately NOT present here.
